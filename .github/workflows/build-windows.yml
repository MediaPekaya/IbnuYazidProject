name: Bina installer Windows (Global Streamer)

# Menyemak sintaks, menjalankan ujian enjin siaran (RTMP sebenar tempatan) dan menghasilkan
# GlobalStreamer-Setup.exe sebagai artifak muat turun (Actions > run > Artifacts).
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'global-streamer/**'
      - '.github/workflows/build-windows.yml'
    tags: ['gs-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    defaults:
      run:
        working-directory: global-streamer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: global-streamer/package-lock.json
      - name: Pasang kebergantungan
        run: npm ci --no-audit --no-fund
      - name: Semak sintaks
        run: npm run check
      - name: Semak terjemahan BM/EN
        run: npm run check:i18n
      - name: Ujian enjin siaran (RTMP sebenar tempatan)
        run: npm run test:engine
      - name: Bina installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: GlobalStreamer-Windows
          path: global-streamer/dist/*.exe
          if-no-files-found: error
      - name: Sediakan keluaran (latest.json untuk halaman muat turun)
        if: startsWith(github.ref, 'refs/tags/gs-v')
        run: npm run release:stage
      - name: Terbitkan GitHub Release (pemasang + latest.yml)
        if: startsWith(github.ref, 'refs/tags/gs-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            global-streamer/dist/*.exe
            global-streamer/dist/*.blockmap
            global-streamer/dist/latest.yml
      - name: Siar ke Firebase Hosting (hanya jika secret FIREBASE_SERVICE_ACCOUNT ada)
        if: startsWith(github.ref, 'refs/tags/gs-v') && env.FIREBASE_SA != ''
        shell: bash
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@13 deploy --only hosting --project global-streamer --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
