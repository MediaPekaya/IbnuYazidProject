name: Bina installer Windows (Global Streamer)

# Menyemak sintaks, menjalankan ujian enjin siaran (RTMP sebenar tempatan) dan menghasilkan
# GlobalStreamer-Setup.exe sebagai artifak muat turun (Actions > run > Artifacts).
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'global-streamer/**'
      - '.github/workflows/build-windows.yml'
    tags: ['gs-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
    defaults:
      run:
        working-directory: global-streamer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: global-streamer/package-lock.json
      - name: Pasang kebergantungan
        run: npm ci --no-audit --no-fund
      - name: Semak sintaks
        run: npm run check
      - name: Semak terjemahan BM/EN
        run: npm run check:i18n
      - name: Ujian enjin siaran (RTMP sebenar tempatan)
        run: npm run test:engine
      - name: 'Tetapkan versi (automatik 0.2.NOMBOR-RUN, atau daripada tag gs-vX.Y.Z)'
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/gs-v* ]]; then V="${GITHUB_REF#refs/tags/gs-v}"; else V="0.2.${GITHUB_RUN_NUMBER}"; fi
          npm version "$V" --no-git-tag-version --allow-same-version
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - name: Arahkan kemas kini automatik app ke repo awam (hanya jika token RELEASES_REPO_TOKEN ada)
        if: env.RELEASES_TOKEN != ''
        shell: bash
        run: npm pkg set "build.publish[0].repo=global-streamer-releases-apps-files"
      - name: Bina installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Salinan pemasang bernama tetap (untuk pautan muat turun /download/windows)
        shell: bash
        run: cp "dist/Global-Streamer-Setup-${{ steps.ver.outputs.v }}.exe" dist/Global-Streamer-Setup.exe
      - name: Versi zip (boleh diekstrak dan dijalankan tanpa pemasang)
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "dist/Global-Streamer-Portable-${{ steps.ver.outputs.v }}.zip" -CompressionLevel Optimal
          Copy-Item "dist/Global-Streamer-Portable-${{ steps.ver.outputs.v }}.zip" "dist/Global-Streamer-Portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: GlobalStreamer-Windows
          path: |
            global-streamer/dist/*.exe
            global-streamer/dist/*.zip
          if-no-files-found: error
      # Setiap push ke main / cabang ccr-* menerbitkan Release baharu. App yang dipasang menyemak Release terkini
      # (electron-updater, penyedia github) setiap 5 minit, memuat turun di latar dan menawarkan "Mulakan semula & pasang".
      - name: Terbitkan GitHub Release (pemasang + latest.yml + blockmap)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || startsWith(github.ref_name, 'ccr-') || startsWith(github.ref, 'refs/tags/gs-v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Global Streamer ${{ steps.ver.outputs.v }}
          make_latest: 'true'
          body: |
            Binaan automatik daripada commit ${{ github.sha }}.
            Pemasang: Global-Streamer-Setup.exe. App yang sudah dipasang akan mengemas kini sendiri.
            Versi zip: Global-Streamer-Portable.zip (ekstrak, kemudian jalankan "Global Streamer.exe"; tiada pemasangan).
          files: |
            global-streamer/dist/Global-Streamer-Setup-${{ steps.ver.outputs.v }}.exe
            global-streamer/dist/Global-Streamer-Setup-${{ steps.ver.outputs.v }}.exe.blockmap
            global-streamer/dist/Global-Streamer-Setup.exe
            global-streamer/dist/Global-Streamer-Portable.zip
            global-streamer/dist/latest.yml
      # Repo awam khas untuk fail muat turun: pelanggan memuat turun dari sini dan app mereka mengemas kini dari sini. Kod sumber kekal peribadi.
      - name: Terbitkan ke repo awam (pelanggan muat turun dan kemas kini automatik)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || startsWith(github.ref_name, 'ccr-') || startsWith(github.ref, 'refs/tags/gs-v')) && env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: MediaPekaya/global-streamer-releases-apps-files
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: v${{ steps.ver.outputs.v }}
          name: Global Streamer ${{ steps.ver.outputs.v }}
          make_latest: 'true'
          body: |
            Global Streamer ${{ steps.ver.outputs.v }}.
            Pemasang: Global-Streamer-Setup.exe (app yang dipasang mengemas kini sendiri).
            Versi zip: Global-Streamer-Portable.zip (ekstrak, kemudian jalankan "Global Streamer.exe"; tiada pemasangan, tiada kemas kini automatik).
          files: |
            global-streamer/dist/Global-Streamer-Setup-${{ steps.ver.outputs.v }}.exe
            global-streamer/dist/Global-Streamer-Setup-${{ steps.ver.outputs.v }}.exe.blockmap
            global-streamer/dist/Global-Streamer-Setup.exe
            global-streamer/dist/Global-Streamer-Portable.zip
            global-streamer/dist/latest.yml
      - name: Siar versi web ke Firebase Hosting (hanya jika secret FIREBASE_SERVICE_ACCOUNT ada)
        if: github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'ccr-')) && env.FIREBASE_SA != ''
        shell: bash
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@13 deploy --only hosting --project global-streamer --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
