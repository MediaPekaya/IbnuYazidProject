name: Bina installer Windows (Global Streamer)

# Menghasilkan GlobalStreamer-Setup.exe sebagai artifak muat turun.
# STATUS: belum diuji. Jalankan secara manual dari tab Actions > "Run workflow".
on:
  workflow_dispatch:
  push:
    tags: ['gs-v*']

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: global-streamer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang kebergantungan
        run: npm install --no-audit --no-fund
      - name: Semak sintaks
        run: npm run check
      - name: Bina installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: GlobalStreamer-Windows
          path: global-streamer/dist/*.exe
          if-no-files-found: error
