name: Bina installer Windows (Global Streamer)

# Menyemak sintaks, menjalankan ujian enjin siaran (RTMP sebenar tempatan) dan menghasilkan
# GlobalStreamer-Setup.exe sebagai artifak muat turun (Actions > run > Artifacts).
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'global-streamer/**'
      - '.github/workflows/build-windows.yml'
    tags: ['gs-v*']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: global-streamer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: global-streamer/package-lock.json
      - name: Pasang kebergantungan
        run: npm ci --no-audit --no-fund
      - name: Semak sintaks
        run: npm run check
      - name: Ujian enjin siaran (RTMP sebenar tempatan)
        run: npm run test:engine
      - name: Bina installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: GlobalStreamer-Windows
          path: global-streamer/dist/*.exe
          if-no-files-found: error
