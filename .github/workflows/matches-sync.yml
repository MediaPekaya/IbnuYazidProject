name: Sync perlawanan tournament MLBB (Global Streamer)

# Mengambil jadual, skor langsung dan keputusan perlawanan (satu panggilan Liquipedia) setiap 30 minit.
# Perlawanan semasa dalam app dipilih automatik daripada data ini. Satu panggilan sahaja jadi ringan terhadap had kadar Liquipedia.
# Jadual (cron) hanya berjalan pada cabang lalai repo. Penyiaran ke Hosting memerlukan secret FIREBASE_SERVICE_ACCOUNT.
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

concurrency:
  group: data-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: global-streamer
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: global-streamer/package-lock.json
      - name: Pasang kebergantungan (tanpa memuat turun Electron)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Kumpul jadual dan keputusan perlawanan
        run: node scripts/data/collect-matches.js
      - name: Kumpul maklumat tournament (pemenang), maks 1 halaman
        run: node scripts/data/collect-tournaments.js --max 1
      - name: Bundel data
        run: node scripts/data/build-bundle.js
      - name: Semak sintaks
        run: npm run check
      - name: Commit jika data berubah
        id: commit
        working-directory: .
        run: |
          git config user.name "gs-data-sync"
          git config user.email "actions@users.noreply.github.com"
          git add global-streamer/renderer/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: kemas kini perlawanan tournament (auto)"
            git pull --rebase --autostash
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Siar ke Firebase Hosting
        if: steps.commit.outputs.changed == 'true' && env.FIREBASE_SA != ''
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@13 deploy --only hosting --project global-streamer --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
