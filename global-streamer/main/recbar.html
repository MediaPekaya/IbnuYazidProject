<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><title>REC</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; color: #eaf4ff; font: 700 14px "Segoe UI", system-ui, sans-serif; user-select: none; overflow: hidden; }
  /* bar penuh: seret pada mana-mana ruang kosong untuk alih ke tempat lain */
  #bar { height: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #0b1020; border: 1px solid #ff3b5c; border-radius: 12px; cursor: grab; }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  i { width: 12px; height: 12px; border-radius: 50%; background: #ff3b5c; box-shadow: 0 0 10px #ff3b5c; animation: p 1.2s ease-in-out infinite; flex: none; }
  .paused i { animation: none; background: #ffd36b; box-shadow: 0 0 10px #ffd36b; }
  @keyframes p { 50% { opacity: .35; } }
  #t { font-variant-numeric: tabular-nums; letter-spacing: .06em; flex: 1; white-space: nowrap; }
  button { cursor: pointer; border: 0; border-radius: 9px; padding: 8px 11px; font: 800 12px "Segoe UI", system-ui, sans-serif; cursor: pointer; color: #fff; white-space: nowrap; transition: filter .15s, transform .15s; }
  button:hover { filter: brightness(1.18); }
  button:active { transform: scale(.97); }
  #p { background: #2b3a63; min-width: 74px; }
  .paused #p { background: #1f8f55; }
  #h { background: #1a2442; }
  #s { background: #ff3b5c; }
  #m, #d { padding: 7px 9px; background: #1a2442; display: grid; place-items: center; }
  #m svg, #d svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #m.off { background: #5a2330; }
  #d:hover { background: #7a2335; }
  /* pil merah apabila disembunyikan: klik untuk buka semula bar */
  /* bulatan merah kecil apabila disembunyikan: seret untuk alih, klik untuk buka semula bar */
  #pill { display: none; width: 100%; height: 100%; box-sizing: border-box; align-items: center; justify-content: center; background: #e0213f; border-radius: 50%; box-shadow: 0 2px 10px rgba(224, 33, 63, .65); cursor: grab; }
  #pill i { width: 12px; height: 12px; background: #fff; box-shadow: none; }
  .paused #pill { background: #c99a1f; }
  body.collapsed #bar { display: none; }
  body.collapsed #pill { display: flex; }
</style></head>
<body>
<div id="bar"><i></i><span id="t">REC 00:00</span>
  <button id="p" type="button" title="Pause / Resume rakaman">Pause</button>
  <button id="h" type="button" title="Sembunyikan bar ini. Klik pil merah REC untuk buka semula (atau Ctrl+Alt+H)">Hide</button>
  <button id="m" type="button" title="Mikrofon: klik untuk senyap / dengar"><svg id="mI" viewBox="0 0 24 24"></svg></button>
  <button id="s" type="button" title="Tamatkan rakaman dan simpan fail">Simpan rakaman</button>
  <button id="d" type="button" title="Buang rakaman (satu klik: rakaman dibatalkan dan fail dipadam)"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13M10.5 11v6M13.5 11v6"/></svg></button>
</div>
<div id="pill" title="Klik untuk buka bar rakaman. Seret untuk alih."><i></i></div>
<script>
  const pad = (n) => String(n).padStart(2, '0');
  let t0 = Date.now(), paused = false, pausedAt = 0, pausedTotal = 0;
  const el = (id) => document.getElementById(id);
  function clock() {
    const now = paused ? pausedAt : Date.now();
    const s = Math.max(0, Math.floor((now - t0 - pausedTotal) / 1000));
    return (s >= 3600 ? pad(Math.floor(s / 3600)) + ':' : '') + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60);
  }
  function render() { const c = clock(); el('t').textContent = (paused ? 'PAUSE ' : 'REC ') + c; }
  setInterval(render, 300);
  window.recbar.onState((st) => {
    const p = !!(st && st.paused);
    if (p && !paused) { paused = true; pausedAt = Date.now(); }
    else if (!p && paused) { paused = false; pausedTotal += Date.now() - pausedAt; }
    document.body.classList.toggle('paused', paused);
    el('p').textContent = paused ? 'Resume' : 'Pause';
    render();
  });
  const MIC_ON = '<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>';
  const MIC_OFF = MIC_ON + '<path d="M4 4l16 16"/>';
  function paintMic(on) { el('m').classList.toggle('off', !on); el('mI').innerHTML = on ? MIC_ON : MIC_OFF; el('m').title = on ? 'Mikrofon hidup: klik untuk senyap' : 'Mikrofon senyap: klik untuk dengar'; }
  paintMic(true);
  window.recbar.onState((st) => { if (st && st.micOn != null) paintMic(!!st.micOn); });
  el('m').addEventListener('click', () => window.recbar.mic());
  el('d').addEventListener('click', () => window.recbar.discard());   // satu klik sahaja
  window.recbar.onCollapsed((c) => document.body.classList.toggle('collapsed', c));
  el('s').addEventListener('click', () => window.recbar.stop());
  el('p').addEventListener('click', () => window.recbar.pause());
  el('h').addEventListener('click', () => window.recbar.hide(true));
  /* seret dengan tetikus: bar hitam (ruang kosong) dan bulatan merah. Klik tanpa seret pada bulatan = buka semula bar. */
  let dr = null;
  function startDrag(ev, isPill) {
    if (ev.button !== 0) return;
    dr = { sx: ev.screenX, sy: ev.screenY, moved: false, isPill };
    window.recbar.drag('start', ev.screenX, ev.screenY);
    ev.currentTarget.setPointerCapture(ev.pointerId);
  }
  function moveDrag(ev) {
    if (!dr) return;
    if (!dr.moved && Math.abs(ev.screenX - dr.sx) + Math.abs(ev.screenY - dr.sy) > 4) { dr.moved = true; document.body.classList.add('dragging'); }
    if (dr.moved) window.recbar.drag('move', ev.screenX, ev.screenY);
  }
  function endDrag(ev) {
    if (!dr) return;
    const d = dr; dr = null;
    document.body.classList.remove('dragging');
    window.recbar.drag('end', ev.screenX, ev.screenY);
    if (d.isPill && !d.moved) window.recbar.hide(false);
  }
  const barEl = el('bar'), pillEl = el('pill');
  barEl.addEventListener('pointerdown', (ev) => { if (!ev.target.closest('button')) startDrag(ev, false); });
  pillEl.addEventListener('pointerdown', (ev) => startDrag(ev, true));
  [barEl, pillEl].forEach((n) => { n.addEventListener('pointermove', moveDrag); n.addEventListener('pointerup', endDrag); n.addEventListener('pointercancel', endDrag); });
</script></body></html>
