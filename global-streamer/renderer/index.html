<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global Streamer</title>
  <meta name="description" content="Global Streamer: studio live seperti OBS dengan template, efek dan chat untuk TikTok, Facebook dan YouTube.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="assets/logo-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#04070f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Global Streamer">
  <meta property="og:image" content="https://global-streamer.web.app/assets/og-image.png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modes.css">
</head>
<body>
  <div class="bg-fx" aria-hidden="true"></div>
  <div id="titlebar" hidden>
    <div class="tb-title"><img src="assets/logo-96.png" alt="" width="16" height="16" onerror="this.remove()"><span>Global Streamer</span></div>
    <div class="tb-ctl" role="group" aria-label="Kawalan tetingkap">
      <button type="button" class="tb-btn min" id="tbMin" title="Kecilkan" aria-label="Kecilkan"><i></i></button>
      <button type="button" class="tb-btn max" id="tbMax" title="Besarkan / pulihkan" aria-label="Besarkan"><i></i></button>
      <button type="button" class="tb-btn close" id="tbClose" title="Tutup" aria-label="Tutup"><i></i></button>
    </div>
  </div>

  <div id="app">
    <header id="topbar">
      <div class="brand">
        <img class="brand-logo" src="assets/logo-96.png" alt="Global Streamer" width="48" height="48" decoding="async">
        <span class="brand-name">GLOBAL STREAMER</span>
        <span class="brand-tag" id="envTag">WEB DEMO</span>
      </div>

      <div class="mode-switch" id="modeSwitch" data-mode="normal" role="group" aria-label="Mod paparan">
        <i class="thumb"></i>
        <button type="button" data-mode="normal" class="on">Normal</button>
        <button type="button" data-mode="studio">Studio</button>
      </div>

      <div class="mode-switch fmt-switch" id="fmtSwitch" data-mode="portrait" role="group" aria-label="Format siaran">
        <i class="thumb"></i>
        <button type="button" data-o="portrait" class="on" title="TikTok LIVE (menegak 9:16)">TikTok</button>
        <button type="button" data-o="landscape" title="YouTube / Facebook (mendatar 16:9)">YouTube · FB</button>
      </div>

      <label class="game-pick"><span>Game</span><select id="gameSelect" aria-label="Pilih game"></select></label>

      <div class="status">
        <span class="chip live hidden"><i></i>LIVE <b id="liveTimer">00:00:00</b></span>
        <span class="chip rec hidden"><i></i>REC <b id="recTimer">00:00:00</b></span>
        <span id="platformChips" class="chips"></span>
        <span class="chip enc hidden" id="encChip" title="Pengekod, FPS, kelajuan pengekodan dan bingkai dilepaskan"></span>
        <span class="chip mute" id="fpsChip">0 FPS</span>
        <button class="chip mute size-chip" id="resChip" title="Saiz output" aria-haspopup="menu">1920×1080</button>
      </div>

      <div class="actions">
        <button type="button" class="btn rec-btn" id="btnRec"></button><button type="button" class="btn rec-btn rec-mode" id="btnRecMode" aria-haspopup="menu" title="Pilih apa yang dirakam" aria-label="Pilih apa yang dirakam">▾</button>
        <button type="button" class="btn primary live-btn" id="btnLive"></button>
        <button type="button" class="icon-btn lg" id="btnSettings" aria-label="Tetapan" title="Tetapan"></button>
        <div class="user-chip" id="userChip"></div>
      </div>
    </header>

    <main id="workspace">
      <section id="stage" aria-label="Paparan siaran">
        <div id="screens" class="screens normal">
          <div class="screen" id="screenPreview">
            <div class="screen-label"><b class="pvw">PRATONTON</b><span>Sunting scene di sini</span></div>
            <div class="screen-view"><canvas id="cvPreview" width="960" height="540" aria-label="Pratonton"></canvas></div>
          </div>
          <div id="transitionCol">
            <button type="button" class="btn primary" id="btnTransition">Peralihan</button>
            <select id="selTransition" aria-label="Jenis peralihan">
              <option value="fade">Pudar</option>
              <option value="slide">Luncur</option>
              <option value="cut">Potong</option>
            </select>
          </div>
          <div class="screen" id="screenProgram">
            <div class="screen-label"><b class="pgm">PROGRAM</b><span>Apa yang penonton nampak</span></div>
            <div class="screen-view"><canvas id="cvProgram" width="1920" height="1080" aria-label="Program"></canvas></div>
          </div>
        </div>
      </section>

      <aside id="right" aria-label="Chat dan kawalan game">
        <div class="rtabs" role="tablist">
          <button type="button" class="rtab on" data-panel="panelChat" role="tab">Chat</button>
          <button type="button" class="rtab" data-panel="panelGame" role="tab">Game</button>
          <button type="button" class="rtab" data-panel="panelMeta" role="tab">Meta</button>
        </div>
        <div class="rpanel on" id="panelChat"><div id="chatBody" class="rbody"></div></div>
        <div class="rpanel" id="panelGame"><div id="gameBody" class="rbody"></div></div>
        <div class="rpanel" id="panelMeta"><div id="metaBody" class="rbody"></div></div>
      </aside>
    </main>

    <footer id="docks">
      <div id="dockLeft">
      <section class="dock" id="dockScenes">
        <div class="dock-head"><h3>Scene</h3><div class="dock-tools"><button type="button" class="icon-btn" id="btnSceneAdd" aria-label="Tambah scene" title="Tambah scene"></button></div></div>
        <div class="dock-body" id="scenesBody"></div>
      </section>
      <section class="dock" id="dockSources">
        <div class="dock-head"><h3>Sumber</h3>
          <div class="dock-tools">
            <button type="button" class="icon-btn" id="btnSourceAdd" aria-label="Tambah sumber" title="Tambah sumber"></button>
            <button type="button" class="icon-btn" id="btnSourceUp" aria-label="Naik satu lapisan" title="Naik"></button>
            <button type="button" class="icon-btn" id="btnSourceDown" aria-label="Turun satu lapisan" title="Turun"></button>
            <button type="button" class="icon-btn" id="btnSourceDel" aria-label="Padam sumber" title="Padam"></button>
          </div>
        </div>
        <div class="dock-body" id="sourcesBody"></div>
      </section>
      <section class="dock" id="dockProps">
        <div class="dock-head"><h3>Sifat</h3></div>
        <div class="dock-body" id="propsBody"></div>
      </section>
      </div>
      <section class="dock" id="dockMixer">
        <div class="dock-head"><h3>Audio Mixer</h3></div>
        <div class="dock-body mixer" id="mixer"></div>
      </section>
      <section class="dock" id="dockTemplates">
        <div class="dock-head"><h3>Template</h3><div class="tpl-cats" id="tplCats" role="tablist" aria-label="Jenis template"><button type="button" data-c="gaming" role="tab">Gaming</button><button type="button" data-c="formal" role="tab">Formal</button><i class="thumb"></i></div><div class="seg-mini" id="tplTabs" role="tablist" aria-label="Format template">
          <button type="button" data-o="portrait" role="tab">TikTok</button><button type="button" data-o="landscape" role="tab">YouTube · FB</button></div></div>
        <div class="dock-body tpl-strip" id="tplBody"></div>
      </section>
    </footer>
  </div>

  <div id="modalRoot"></div>

  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/lang-en.js"></script>
  <script src="js/icons.js"></script>
  <script src="data/mlbb-data.js"></script>
<script src="data/meta-data.js"></script>
<script src="data/tourney-data.js"></script>
<script src="games/mlbb/heroes.js"></script>
  <script src="games/mlbb/items.js"></script>
  <script src="js/heroimg.js"></script>
  <script src="games/mlbb/game.js"></script>
  <script src="games/mlbb/templates2d.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/media.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/widgets2.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/compositor.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/formats.js"></script>
  <script src="js/platforms.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/chat-adapters.js"></script>
  <script src="js/gamedock.js"></script>
  <script src="js/meta.js"></script>
  <script src="js/tourney.js"></script>
  <script src="js/detect.js"></script>
  <script src="js/detectui.js"></script>
  <script src="data/digits.js"></script>
  <script src="data/result-templates.js"></script>
  <script src="data/announcer-clips.js"></script>
  <script src="js/events.js"></script>
  <script src="js/eventsui.js"></script>
  <script src="js/tourneyui.js"></script>
<script src="js/gamedock2.js"></script>
<script src="js/gamedock3.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/voiceui.js"></script>
  <script src="js/updater.js"></script>
  <script src="js/popout.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/recres.js"></script>
  <script src="js/golive.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/sources2.js"></script>
  <script src="data/changelog.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/winframe.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
