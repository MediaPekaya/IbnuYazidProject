<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malaysia Image Tools</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="MALAYSIA IMAGE TOOLS — Alat gambar percuma: tukar format, mampat, ubah saiz, potong, sunting dan banyak lagi. Semua diproses dalam browser anda.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Anton&display=swap">
<style>
/* Layout: fixed left sidebar (drawer on phones) + scrolling workspace; home = hero + category grids, tool = header + workspace (stage | panel) */
:root{
  --bg:#ffffff;
  --soft:#f5f6fc;
  --soft-2:#eef0f9;
  --line:#e3e6f2;
  --ink:#0e1530;
  --ink-2:#2b3352;
  --muted:#626b88;
  --blue:#2457f5;
  --blue-50:#edf2ff;
  --violet:#7b3fe4;
  --violet-50:#f3eeff;
  --grad:linear-gradient(135deg,#2457f5 0%,#7b3fe4 100%);
  --ok:#0f9d63; --ok-50:#e7f8f0;
  --warn:#b86e00; --warn-50:#fff5e1;
  --bad:#d6334a; --bad-50:#ffecef;
  --shadow:0 1px 2px rgba(20,30,80,.06),0 8px 24px -12px rgba(20,30,80,.18);
  --shadow-lg:0 24px 60px -20px rgba(36,60,180,.35);
  --r:14px; --r-sm:10px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side:272px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--blue)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;z-index:40;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;text-decoration:none;color:var(--ink)}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 6px 16px -6px rgba(60,70,230,.6)}
.brand-mark svg{width:22px;height:22px}
.brand b{display:block;font-size:13.5px;letter-spacing:.06em;font-weight:800;line-height:1.15}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.side-search{padding:4px 14px 10px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:0 34px 0 36px;outline:none;transition:.15s}
.search input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px var(--blue-50)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:600 11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:#fff}
.nav{overflow-y:auto;padding:4px 10px 16px;flex:1;scrollbar-width:thin}
.nav h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 8px 6px;font-weight:700;display:flex;justify-content:space-between}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:500}
.nav a svg{width:17px;height:17px;flex:none;color:var(--muted)}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--blue-50);color:var(--blue);font-weight:650}
.nav a.on svg{color:var(--blue)}
.nav a.home-link{font-weight:650}
.side-foot{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.privacy-pill{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ok);background:var(--ok-50);border-radius:9px;padding:8px 10px;font-weight:600}
.privacy-pill svg{width:16px;height:16px;flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.topbar .brand{padding:0}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px}
.content{width:100%;max-width:1240px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.content{padding-left:36px;padding-right:36px}}
.scrim{display:none}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(86vw,300px);transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow-lg)}
  .app.drawer .sidebar{transform:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(14,21,48,.38);z-index:35}
  .topbar{display:flex}
}

/* ---------- Banners ---------- */
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px 14px;font-size:13.5px;margin-bottom:16px;border:1px solid}
.banner svg{width:18px;height:18px;flex:none;margin-top:2px}
.banner.info{background:var(--blue-50);border-color:#cfdcff;color:#1d3fb8}
.banner.warning{background:var(--warn-50);border-color:#f6dca6;color:var(--warn)}
.banner.success{background:var(--ok-50);border-color:#b8ead2;color:var(--ok)}

/* ---------- Hero ---------- */
.hero{position:relative;isolation:isolate;border-radius:24px;overflow:hidden;color:#fff;padding:clamp(22px,4vw,44px);
  background:
    radial-gradient(520px 300px at 8% 0%,rgba(25,195,240,.55),transparent 65%),
    radial-gradient(560px 340px at 100% 100%,rgba(236,72,153,.45),transparent 65%),
    radial-gradient(500px 300px at 70% 10%,rgba(123,63,228,.7),transparent 70%),
    linear-gradient(135deg,#1338c9 0%,#2457f5 38%,#5b3fe0 70%,#7b3fe4 100%);
  box-shadow:0 30px 70px -30px rgba(52,62,220,.65)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 30% 40%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at 30% 40%,#000 30%,transparent 80%)}
.hero::after{content:"";position:absolute;z-index:-1;width:340px;height:340px;right:-90px;top:-120px;border-radius:50%;border:2px dashed rgba(255,255,255,.22);animation:spinslow 40s linear infinite}
@keyframes spinslow{to{transform:rotate(360deg)}}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:899px){.hero-grid{grid-template-columns:minmax(0,1fr)}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:999px;backdrop-filter:blur(6px)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#5ef2b0;box-shadow:0 0 0 4px rgba(94,242,176,.3),0 0 12px #5ef2b0}
.hero h1{font-size:clamp(32px,5.4vw,56px);font-weight:800;letter-spacing:-.02em;margin:14px 0 8px;line-height:1.02;color:#fff;text-shadow:0 4px 24px rgba(10,20,90,.35)}
.hero h1 span{background:linear-gradient(90deg,#7ff0ff 0%,#ffd36e 50%,#ff8fd1 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.hero p.sub{font-size:clamp(15px,1.8vw,18px);color:rgba(255,255,255,.9);margin:0 0 20px;font-weight:600}
.hero .search input{height:54px;font-size:15.5px;border-radius:14px;background:#fff;border-color:transparent;box-shadow:0 14px 34px -14px rgba(5,10,60,.6);padding-left:46px;color:var(--ink)}
.hero .search input:focus{box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.hero .search svg{left:16px;width:19px;height:19px;color:var(--violet)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.quick a{font-size:12.5px;font-weight:650;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;backdrop-filter:blur(6px);transition:.15s}
.quick a:hover{background:#fff;color:var(--blue)}
.quick a.hot{background:linear-gradient(90deg,#ffd36e,#ff8fd1);color:#3a1450;border-color:transparent}
.hero-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{position:relative;background:rgba(255,255,255,.95);border-radius:18px;padding:16px;box-shadow:0 18px 40px -20px rgba(5,10,60,.7);overflow:hidden;color:var(--ink)}
.stat::after{content:"";position:absolute;right:-24px;bottom:-24px;width:84px;height:84px;border-radius:50%;background:var(--tint);opacity:.16}
.stat .si{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--tint);margin-bottom:10px;box-shadow:0 8px 16px -8px var(--tint)}
.stat .si svg{width:18px;height:18px}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--tint)}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.stat.t1{--tint:#2457f5}.stat.t2{--tint:#0f9d63}.stat.t3{--tint:#e0457b}.stat.t4{--tint:#7b3fe4}
/* Warna kategori pada seksyen */
.sec-head h2{display:flex;align-items:center;gap:10px}
.sec-head h2::before{content:"";width:10px;height:26px;border-radius:4px;background:var(--grad)}

/* ---------- Sections & cards ---------- */
.sec{margin-top:36px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font-size:21px;font-weight:800;letter-spacing:-.01em}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.count{font:600 12px var(--mono);color:var(--muted);background:var(--soft);border:1px solid var(--line);padding:3px 8px;border-radius:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tcard{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);background:#fff;transition:transform .15s,box-shadow .15s,border-color .15s}
.tcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#cdd5f3}
.tcard h3{font-size:15px;font-weight:700}
.tcard p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.ticon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.ticon svg{width:22px;height:22px}
.c-convert .ticon{background:var(--blue-50);color:var(--blue)}
.c-edit .ticon{background:var(--violet-50);color:var(--violet)}
.c-util .ticon{background:linear-gradient(135deg,var(--blue-50),var(--violet-50));color:#4b4be8}
.tag{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--grad);color:#fff}
.tcard .arrow{margin-top:auto;font-size:12.5px;font-weight:650;color:var(--blue);display:flex;align-items:center;gap:4px}
.tcard .arrow svg{width:15px;height:15px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:700px){.how{grid-template-columns:minmax(0,1fr)}}
.how div{padding:16px;border-radius:var(--r);background:var(--soft);border:1px solid var(--line)}
.how b{display:flex;align-items:center;gap:8px;font-size:14px}
.how b em{font-style:normal;width:24px;height:24px;border-radius:7px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:12px}
.how p{margin:6px 0 0;font-size:13px;color:var(--muted)}

/* ---------- Tool page ---------- */
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--blue)}
.tool-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.tool-head .ticon{width:52px;height:52px;border-radius:15px;flex:none}
.tool-head .ticon svg{width:26px;height:26px}
.tool-head h1{font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-.015em}
.tool-head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.ok{background:var(--ok-50);border-color:#bfe9d4;color:var(--ok)}
.chip.warn{background:var(--warn-50);border-color:#f3dba8;color:var(--warn)}
.chip.bad{background:var(--bad-50);border-color:#f6c2cb;color:var(--bad)}
.chip.blue{background:var(--blue-50);border-color:#cfdcff;color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}

/* Dropzone */
.dz{position:relative;border:2px dashed #c9d2f2;border-radius:18px;background:linear-gradient(180deg,#fbfcff,#f5f7ff);padding:clamp(24px,5vw,44px) 18px;text-align:center;cursor:pointer;transition:.15s;display:grid;justify-items:center;gap:6px}
.dz:hover,.dz.over{border-color:var(--blue);background:var(--blue-50)}
.dz.over{transform:scale(1.005);box-shadow:0 0 0 6px rgba(36,87,245,.08)}
.dz input{display:none}
.dz-ico{width:56px;height:56px;border-radius:16px;background:var(--grad);color:#fff;display:grid;place-items:center;margin-bottom:6px;box-shadow:0 10px 24px -10px rgba(60,70,230,.7)}
.dz-ico svg{width:26px;height:26px}
.dz b{font-size:16px}
.dz span{font-size:13px;color:var(--muted)}
.dz.compact{padding:16px;grid-template-columns:auto 1fr auto;text-align:left;justify-items:start;align-items:center;gap:12px}
.dz.compact .dz-ico{width:40px;height:40px;margin:0;border-radius:12px}
.dz.compact .dz-ico svg{width:20px;height:20px}
.dz.compact b{font-size:14px}

/* Buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:650;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);transition:.15s}
.btn:hover{border-color:#bcc6ea;background:var(--soft)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px -10px rgba(60,70,230,.8)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-50);border-color:#f3c0c8}
.btn.ghost{background:transparent}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.on{border-color:var(--blue);background:var(--blue-50);color:var(--blue)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.fld{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.fld>span{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fld output{font:600 12px var(--mono);color:var(--blue);background:var(--blue-50);padding:1px 7px;border-radius:6px}
.inp,select.inp,textarea.inp{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 11px;background:#fff;width:100%;outline:none;font-weight:500}
textarea.inp{height:auto;padding:9px 11px;resize:vertical;min-height:70px}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-50)}
input[type=range]{width:100%;accent-color:var(--blue);height:22px}
input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:3px;background:#fff;cursor:pointer}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:650;cursor:pointer}
.seg button:hover{border-color:#bcc6ea}
.seg button.on{background:var(--blue-50);border-color:var(--blue);color:var(--blue)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ctrls{display:grid;gap:16px}
.panel-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 -4px}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* Workspace */
.ws{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start;margin-top:16px}
@media (max-width:1000px){.ws{grid-template-columns:minmax(0,1fr)}}
.ws-panel{padding:16px;display:grid;gap:16px;position:sticky;top:16px}
@media (max-width:1000px){.ws-panel{position:static}}
.stage-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.stage{padding:14px;display:grid;place-items:center;min-height:260px;background:
  conic-gradient(#f1f3f9 25%,#fff 0 50%,#f1f3f9 0 75%,#fff 0) 0 0/18px 18px;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.stage canvas,.stage img{max-width:100%;max-height:62vh;height:auto;display:block;box-shadow:0 4px 20px -8px rgba(20,30,80,.3)}
.meta-line{font:500 12px var(--mono);color:var(--muted)}

/* File list */
.flist{display:grid;gap:10px;margin-top:14px}
.fitem{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.fitem .th{width:64px;height:64px;border-radius:9px;object-fit:cover;background:var(--soft);border:1px solid var(--line)}
.fitem .nm{font-weight:650;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .sub{font:500 12px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px}
.fitem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.fitem{grid-template-columns:56px minmax(0,1fr)}.fitem .th{width:56px;height:56px}.fitem .acts{grid-column:1/-1;justify-content:flex-start}}
.cmp-thumbs{display:flex;gap:6px;align-items:center}
.cmp-thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.cmp-thumbs svg{width:14px;height:14px;color:var(--muted)}
.save{font:700 12px var(--mono);padding:2px 7px;border-radius:6px}
.save.good{color:var(--ok);background:var(--ok-50)}
.save.neutral{color:var(--warn);background:var(--warn-50)}

    if (!st) return; const s = sc(); const dx = (e.clientX - st.px) / s, dy = (e.clientY - st.py) / s; const o = st.r;
    if (st.h === 'move') { r.x = clamp(o.x + dx, 0, W - o.w); r.y = clamp(o.y + dy, 0, H - o.h); }
    else {
      const west = st.h.includes('w'), north = st.h.includes('n');
      const ax = west ? o.x + o.w : o.x, ay = north ? o.y + o.h : o.y;
      let px = (west ? o.x : o.x + o.w) + dx, py = (north ? o.y : o.y + o.h) + dy;
      px = west ? Math.min(px, ax - MIN) : Math.max(px, ax + MIN);
      py = north ? Math.min(py, ay - MIN) : Math.max(py, ay + MIN);
      let w = Math.min(Math.abs(px - ax), west ? ax : W - ax), h = Math.min(Math.abs(py - ay), north ? ay : H - ay);
      if (aspect) { if (w / h > aspect) w = h * aspect; else h = w / aspect; }
      r = { x: west ? ax - w : ax, y: north ? ay - h : ay, w, h };
    }
    paint();
  });
  const end = () => { st = null; };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
  box.addEventListener('keydown', e => {
    const step = (e.shiftKey ? 10 : 1) / sc(); const m = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (!m) return; e.preventDefault(); r.x = clamp(r.x + m[0], 0, W - r.w); r.y = clamp(r.y + m[1], 0, H - r.h); paint();
  });
  const ro = new ResizeObserver(paint); ro.observe(im);
  im.addEventListener('load', paint);
  const api = {
    get: () => ({ x: Math.round(r.x), y: Math.round(r.y), w: Math.max(1, Math.round(r.w)), h: Math.max(1, Math.round(r.h)) }),
    setAspect(a) { aspect = a; r = init(a); paint(); },
    setRound(on) { box.classList.toggle('round', !!on); },
    destroy() { ro.disconnect(); }
  };
  return api;
}

/* Paparan perbandingan sebelum/selepas dengan peluncur */
function compareView(beforeSrc, afterSrc, labels = ['Sebelum', 'Selepas']) {
  const el = document.createElement('div');
  el.className = 'cmp';
  el.innerHTML = `<img alt="${esc(labels[1])}"><div class="top"><img alt="${esc(labels[0])}"></div><div class="bar"><i>${icon('lr')}</i></div><span class="lbl l">${esc(labels[0])}</span><span class="lbl r">${esc(labels[1])}</span>`;
  const base = el.children[0], top = $('.top', el), topImg = $('.top img', el), bar = $('.bar', el);
  base.src = afterSrc; topImg.src = beforeSrc;
  let pos = .5;
  const set = p => { pos = clamp(p, 0, 1); top.style.width = pos * 100 + '%'; bar.style.left = pos * 100 + '%'; topImg.style.width = base.clientWidth + 'px'; topImg.style.height = base.clientHeight + 'px'; };
  const fromEvt = e => { const r = el.getBoundingClientRect(); set((e.clientX - r.left) / r.width); };
  let drag = false;
  el.addEventListener('pointerdown', e => { drag = true; el.setPointerCapture(e.pointerId); fromEvt(e); });
  el.addEventListener('pointermove', e => drag && fromEvt(e));
  el.addEventListener('pointerup', () => drag = false);
  el.tabIndex = 0;
  el.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') set(pos - .05); if (e.key === 'ArrowRight') set(pos + .05); });
  base.addEventListener('load', () => set(pos));
  new ResizeObserver(() => set(pos)).observe(el);
  el._set = set;
  return el;
}
function showCompare(title, beforeSrc, afterSrc) {
  const wrap = document.createElement('div'); wrap.style.display = 'grid'; wrap.style.gap = '10px'; wrap.style.justifyItems = 'center';
  wrap.appendChild(compareView(beforeSrc, afterSrc));
  const n = document.createElement('div'); n.className = 'meta-line'; n.textContent = 'Seret peluncur ke kiri/kanan untuk membandingkan.'; wrap.appendChild(n);
  openModal(title, wrap);
}
function showImage(title, src) { const im = document.createElement('img'); im.src = src; im.alt = title; im.style.maxHeight = '75vh'; openModal(title, im); }

/* ---------- Rangka A: penukar kelompok (batch) ---------- */
function batchConvertTool(def) {
  return {
    ...def,
    mount(root, scope) {
      const items = []; // {id,file,img,url,blob,outUrl}
      const v = { out: def.to || 'image/jpeg', quality: 92, bg: '#ffffff' };
      root.innerHTML = `<div data-r="dz"></div>
        <div class="card toolbar" data-r="bar" hidden>
          ${def.to ? `<div class="fld"><span>Format output</span><div class="chip blue" style="justify-self:start">${MIME_LABEL[def.to]}</div></div>` :
          `<div class="fld"><label for="cvOut">Format output</label><select class="inp" id="cvOut"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WEBP</option></select></div>`}
          <div class="fld" data-r="qwrap"><span><label for="cvQ">Kualiti</label><output data-r="qo">92%</output></span><input id="cvQ" type="range" min="10" max="100" value="92"></div>
          <div class="fld" data-r="bgwrap" style="max-width:150px"><label for="cvBg">Latar (lutsinar → JPG)</label><input id="cvBg" type="color" value="#ffffff"></div>
          <div class="row"><button class="btn primary" data-r="go" type="button">${icon('convert')}Tukar Semua</button><button class="btn" data-r="all" type="button" disabled>${icon('download')}Muat Turun Semua</button><button class="btn danger" data-r="reset" type="button">${icon('trash')}Reset</button></div>
        </div>
        <div class="summary" data-r="sum"></div>
        <div class="flist" data-r="list"></div>`;
      const R = k => $(`[data-r="${k}"]`, root);
      R('dz').appendChild(dropzone({ accept: def.accept, multiple: true, title: `Seret & lepas fail ${def.fromLabel} di sini`, hint: `Boleh pilih banyak fail · maksimum ${CONFIG.maxFiles} fail, ${CONFIG.maxImageMB} MB setiap satu`, onFiles: add }));
      const outSel = $('#cvOut', root);
      const syncOpts = () => { const o = outSel ? outSel.value : v.out; v.out = o; R('qwrap').hidden = o === 'image/png'; R('bgwrap').hidden = o !== 'image/jpeg'; items.forEach(it => { it.blob = null; }); renderList(); };
      outSel && outSel.addEventListener('change', syncOpts);
      $('#cvQ', root).addEventListener('input', e => { v.quality = +e.target.value; R('qo').textContent = v.quality + '%'; items.forEach(it => it.blob = null); renderList(); });
      $('#cvBg', root).addEventListener('input', e => { v.bg = e.target.value; items.forEach(it => it.blob = null); });
      syncOpts();
      async function add(files) {
        const ok = checkFiles(files, { types: def.types, current: items.length });
        for (const f of ok) {
          try { const img = await loadImage(f); scope.urls.push(img._url); items.push({ id: Math.random().toString(36).slice(2), file: f, img }); }
          catch (e) { toast(e.message, 'error'); }
        }
        renderList();
      }
      function renderList() {
        R('bar').hidden = !items.length;
        R('all').disabled = !items.some(i => i.blob);
        const done = items.filter(i => i.blob);
        R('sum').innerHTML = items.length ? `<span>Fail: <b>${items.length}</b></span><span>Saiz asal: <b>${fmtBytes(items.reduce((a, i) => a + i.file.size, 0))}</b></span>${done.length ? `<span>Siap: <b>${done.length}/${items.length}</b></span><span>Saiz baharu: <b>${fmtBytes(done.reduce((a, i) => a + i.blob.size, 0))}</b></span>` : ''}` : '';
        R('list').innerHTML = items.map(it => `<div class="fitem" data-id="${it.id}">
          <img class="th" src="${it.outUrl && it.blob ? it.outUrl : it.img._url}" alt="">
          <div style="min-width:0"><div class="nm">${esc(it.file.name)}</div>
            <div class="sub"><span>${MIME_LABEL[it.file.type] || it.file.type}</span><span>${it.img.naturalWidth}×${it.img.naturalHeight}</span><span>${fmtBytes(it.file.size)}</span>
            ${it.blob ? `<span>→ ${MIME_LABEL[it.blob.type]} · ${fmtBytes(it.blob.size)}</span><span class="chip ok" style="padding:0 7px">${icon('check')}Siap</span>` : '<span>Belum ditukar</span>'}</div></div>
          <div class="acts">${it.blob ? `<button class="btn sm" data-a="view" type="button">Pratonton</button><button class="btn sm primary" data-a="dl" type="button">${icon('download')}Muat Turun</button>` : ''}<button class="btn sm danger" data-a="rm" type="button" aria-label="Buang fail">${icon('trash')}</button></div></div>`).join('');
      }
      R('list').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return; const it = items.find(i => i.id === b.closest('.fitem').dataset.id); if (!it) return;
        if (b.dataset.a === 'rm') { items.splice(items.indexOf(it), 1); renderList(); }
        if (b.dataset.a === 'dl') saveBlob(it.blob, `${baseName(it.file.name)}.${EXT[it.blob.type]}`, def.id);
        if (b.dataset.a === 'view') showCompare(it.file.name, it.img._url, it.outUrl);
      });
      async function convertAll() {
        if (!items.length) return;
        await withBusy('Menukar gambar...', async () => {
          for (let k = 0; k < items.length; k++) {
            const it = items[k]; busy(true, `Menukar ${k + 1}/${items.length}...`);
            try {
              const c = toCanvas(it.img);
              let src = c;
              if (v.out === 'image/jpeg' && v.bg !== '#ffffff') { src = makeCanvas(c.width, c.height); const x = ctx2d(src); x.fillStyle = v.bg; x.fillRect(0, 0, c.width, c.height); x.drawImage(c, 0, 0); }
              it.blob = await encode(src, v.out, v.quality / 100);
              if (it.outUrl) URL.revokeObjectURL(it.outUrl);
              it.outUrl = URL.createObjectURL(it.blob); scope.urls.push(it.outUrl);
            } catch (e) { toast(`${it.file.name}: ${e.message}`, 'error'); }
            finally { busy(false); }
            setProgress((k + 1) / items.length); await sleep(0);
          }
          toast(`${items.filter(i => i.blob).length} gambar berjaya ditukar.`, 'success');
        });
        renderList();
      }
      R('go').addEventListener('click', convertAll);
      R('all').addEventListener('click', () => saveZip(items.filter(i => i.blob).map(i => ({ blob: i.blob, name: `${baseName(i.file.name)}.${EXT[i.blob.type]}` })), `${def.id}-${Date.now()}.zip`, def.id));
      R('reset').addEventListener('click', () => { items.length = 0; renderList(); toast('Semua fail dibuang.', 'info'); });
    }
  };
}

/* ---------- Rangka B: penyunting satu gambar ---------- */
function editorTool(def) {
  return {
    ...def,
    mount(root, scope) {
      const v = JSON.parse(JSON.stringify(def.defaults || {}));
      const fmts = def.formats || ['image/png', 'image/jpeg', 'image/webp'];
      let img = null, prev = null, file = null, holding = false;
      const ex = { fmt: def.defaultFormat || null, q: 92 };
      root.innerHTML = `<div data-r="dz"></div>
        <div class="ws" data-r="ws" hidden>
          <div class="card"><div class="stage-bar"><span class="chip" data-r="info"></span><span class="sp"></span>
            <button class="btn sm ghost" data-r="hold" type="button">Tahan: lihat asal</button>
            <button class="btn sm" data-r="change" type="button">${icon('upload')}Tukar gambar</button></div>
            <div class="stage"><canvas data-r="cv"></canvas></div></div>
          <aside class="card ws-panel"><p class="panel-title">Tetapan</p><div class="ctrls" data-r="ctrls"></div><hr class="sep"><p class="panel-title">Simpan</p><div class="ctrls" data-r="exp"></div></aside>
        </div>`;
      const R = k => $(`[data-r="${k}"]`, root);
      const dz = dropzone({ accept: 'image/*', title: 'Seret & lepas gambar di sini', hint: `JPG, PNG, WEBP · maksimum ${CONFIG.maxImageMB} MB`, onFiles: load });
      R('dz').appendChild(dz);
      const cv = R('cv');
      async function load(files) {
        const [f] = checkFiles(files, { max: 1 }); if (!f) return;
        try {
          img = await loadImage(f); scope.urls.push(img._url); file = f;
          prev = toCanvas(img, CONFIG.previewMax);
          if (!ex.fmt) ex.fmt = fmts.includes(f.type) ? f.type : fmts[0];
          R('dz').hidden = true; R('ws').hidden = false;
          def.onLoad && def.onLoad(v, img);
          renderControls(R('ctrls'), def.controls, v, draw);
          renderExport(); draw();
        } catch (e) { toast(e.message, 'error'); }
      }
      function renderExport() {
        const opts = fmts.map(m => [m, MIME_LABEL[m]]);
        renderControls(R('exp'), [
          ...(fmts.length > 1 ? [{ type: 'seg', key: 'fmt', label: 'Format', options: opts }] : []),
          { type: 'range', key: 'q', label: 'Kualiti', min: 10, max: 100, unit: '%', show: e => e.fmt !== 'image/png' },
        ], ex, () => { });
        const row = document.createElement('div'); row.className = 'row';
        row.innerHTML = `<button class="btn primary" type="button" data-r="dl" style="flex:1">${icon('download')}Muat Turun</button><button class="btn" type="button" data-r="rs">${icon('reset')}Set Semula</button>`;
        R('exp').appendChild(row);
        R('dl').onclick = exportFull;
        R('rs').onclick = () => { Object.assign(v, JSON.parse(JSON.stringify(def.defaults || {}))); def.onLoad && def.onLoad(v, img); renderControls(R('ctrls'), def.controls, v, draw); draw(); };
      }
      const draw = rafThrottle(async () => {
        if (!prev) return;
        if (holding) { copyTo(prev); return; }
        const s = prev.width / img.naturalWidth;
        const out = await def.draw(prev, v, s, img);
        copyTo(out);
        R('info').textContent = def.info ? def.info(v, img) : `${img.naturalWidth}×${img.naturalHeight} px · ${fmtBytes(file.size)}`;
      });
      function copyTo(c) { cv.width = c.width; cv.height = c.height; cv.getContext('2d').drawImage(c, 0, 0); }
      const hold = R('hold');
      hold.addEventListener('pointerdown', () => { holding = true; draw(); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(e => hold.addEventListener(e, () => { if (holding) { holding = false; draw(); } }));
      R('change').addEventListener('click', () => dz.querySelector('input').click());
      async function exportFull() {
        await withBusy('Menyediakan fail resolusi penuh...', async () => {
          await sleep(30);
          if (def.export) { const r = await def.export(img, v, ex, file); saveBlob(r.blob, r.name, def.id); return; }
          const full = toCanvas(img);
          const out = await def.draw(full, v, 1, img);
          const blob = await encode(out, ex.fmt, ex.q / 100);
          saveBlob(blob, `${baseName(file.name)}-${def.suffix || def.id}.${EXT[blob.type]}`, def.id);
        });
      }
    }
  };
}

/* ---------- Image to PDF ---------- */
registerTool({
  id: 'image-to-pdf', cat: 'convert', name: 'Image to PDF', icon: 'pdf', popular: true,
  desc: 'Gabungkan beberapa gambar menjadi satu fail PDF. Susun semula halaman sebelum simpan.',
  mount(root, scope) {

      <div class="ws" data-r="ws" hidden><div class="card pad"><div class="row" style="margin-bottom:10px"><b>Halaman</b><span class="count" data-r="cnt"></span><span class="sp"></span><span class="meta-line">Guna ▲▼ untuk susun semula</span></div><div class="flist" data-r="list" style="margin:0"></div></div>

    const R = k => $(`[data-r="${k}"]`, root);
    const dz = dropzone({ accept: 'image/jpeg,image/png,image/webp', multiple: true, title: 'Seret & lepas gambar untuk PDF', hint: 'JPG, PNG, WEBP · boleh pilih banyak gambar', onFiles: add });
    R('dz').appendChild(dz);
    renderControls(R('ctrls'), [
      { type: 'select', key: 'page', label: 'Saiz halaman', options: [['a4', 'A4 (210 × 297 mm)'], ['letter', 'Letter (216 × 279 mm)'], ['a5', 'A5 (148 × 210 mm)'], ['fit', 'Ikut saiz gambar']] },
      { type: 'seg', key: 'orient', label: 'Orientasi', options: [['auto', 'Auto'], ['p', 'Potret'], ['l', 'Landskap']], show: v => v.page !== 'fit' },
      { type: 'seg', key: 'margin', label: 'Jidar (mm)', options: [[0, 'Tiada'], [5, '5'], [10, '10'], [20, '20']], show: v => v.page !== 'fit' },
      { type: 'range', key: 'quality', label: 'Kualiti gambar', min: 40, max: 100, unit: '%' }
    ], v, () => { });
    async function add(files) {
      const ok = checkFiles(files, { types: ['image/jpeg', 'image/png', 'image/webp'], current: items.length });
      for (const f of ok) { try { const img = await loadImage(f); scope.urls.push(img._url); items.push({ id: Math.random().toString(36).slice(2), file: f, img }); } catch (e) { toast(e.message, 'error'); } }
      render();
    }
    function render() {
      R('ws').hidden = !items.length; dz.classList.toggle('compact', items.length > 0);
      R('cnt').textContent = items.length + ' halaman';
      R('list').innerHTML = items.map((it, i) => `<div class="fitem" data-id="${it.id}"><img class="th" src="${it.img._url}" alt=""><div style="min-width:0"><div class="nm">${i + 1}. ${esc(it.file.name)}</div><div class="sub"><span>${it.img.naturalWidth}×${it.img.naturalHeight}</span><span>${fmtBytes(it.file.size)}</span></div></div>

    }

      const b = e.target.closest('button'); if (!b) return; const i = items.findIndex(x => x.id === b.closest('.fitem').dataset.id);
      if (b.dataset.a === 'rm') items.splice(i, 1);
      if (b.dataset.a === 'up' && i > 0) [items[i - 1], items[i]] = [items[i], items[i - 1]];
      if (b.dataset.a === 'down' && i < items.length - 1) [items[i + 1], items[i]] = [items[i], items[i + 1]];
      render();

      const SIZES = { a4: [595.28, 841.89], letter: [612, 792], a5: [419.53, 595.28] };
      let doc = null;
      for (let k = 0; k < items.length; k++) {
        const img = items[k].img; const iw = img.naturalWidth, ih = img.naturalHeight;
        let pw, ph, m;
        if (v.page === 'fit') { pw = iw * .75; ph = ih * .75; m = 0; }
        else {
          [pw, ph] = SIZES[v.page]; const land = v.orient === 'l' || (v.orient === 'auto' && iw > ih);
          if (land) [pw, ph] = [ph, pw]; m = v.margin * 2.8346;
        }
        const o = pw > ph ? 'l' : 'p';
        if (!doc) doc = new jsPDF({ unit: 'pt', format: [pw, ph], orientation: o, compress: true });
        else doc.addPage([pw, ph], o);
        const s = Math.min((pw - 2 * m) / iw, (ph - 2 * m) / ih);
        const w = iw * s, h = ih * s;
        const maxPx = Math.min(1, 3000 / Math.max(iw, ih));
        const c = makeCanvas(iw * maxPx, ih * maxPx); const x = ctx2d(c); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        doc.addImage(c.toDataURL('image/jpeg', v.quality / 100), 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h, undefined, 'FAST');
        setProgress((k + 1) / items.length); await sleep(0);
      }
      saveBlob(doc.output('blob'), `gambar-${items.length}-halaman.pdf`, 'image-to-pdf');
    }));
  }
});

/* ---------- PDF to Image ---------- */
registerTool({
  id: 'pdf-to-image', cat: 'convert', name: 'PDF to Image', icon: 'pdfimg', isNew: true,
  desc: 'Tukar setiap halaman PDF kepada gambar PNG atau JPG berkualiti tinggi.',
  mount(root, scope) {
    let pdf = null, file = null; const results = [];
    const v = { scale: 2, fmt: 'image/png', q: 90, range: '' };
    root.innerHTML = `<div data-r="dz"></div><div data-r="ws" hidden>
      <div class="card toolbar"><div class="fld"><span>Fail</span><div class="nm" data-r="nm" style="font-weight:650"></div></div><div class="ctrls" data-r="ctrls" style="flex:3;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"></div>
      <div class="row"><button class="btn primary" data-r="go" type="button">${icon('pdfimg')}Tukar Halaman</button><button class="btn" data-r="all" type="button" disabled>${icon('download')}Muat Turun Semua</button><button class="btn danger" data-r="reset" type="button">${icon('trash')}Reset</button></div></div>
      <div class="rgrid" data-r="res"></div></div>`;
    const R = k => $(`[data-r="${k}"]`, root);
    R('dz').appendChild(dropzone({ accept: 'application/pdf,.pdf', title: 'Seret & lepas fail PDF di sini', hint: `Satu fail PDF · maksimum ${CONFIG.maxPdfMB} MB`, onFiles: load }));
    renderControls(R('ctrls'), [
      { type: 'seg', key: 'scale', label: 'Resolusi', options: [[1, '72 DPI'], [2, '144 DPI'], [3, '216 DPI']] },
      { type: 'seg', key: 'fmt', label: 'Format', options: [['image/png', 'PNG'], ['image/jpeg', 'JPG']] },
      { type: 'text', key: 'range', label: 'Halaman (kosong = semua)', placeholder: 'cth: 1-3, 5' }
    ], v, () => { });
    async function load(files) {
      const [f] = checkFiles(files, { types: ['application/pdf'], maxMB: CONFIG.maxPdfMB, max: 1 }); if (!f) return;
      await withBusy('Membuka PDF...', async () => {
        await loadScript(LIBS.pdfjs); await loadScript(LIBS.pdfworker);
        pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfworker;
        pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
        file = f; results.length = 0;
        R('nm').innerHTML = `${esc(f.name)} <span class="count">${pdf.numPages} halaman</span>`;
        R('dz').hidden = true; R('ws').hidden = false; renderRes();
      });
    }
    function parseRange(s, n) {
      if (!s.trim()) return Array.from({ length: n }, (_, i) => i + 1);
      const set = new Set();
      s.split(',').forEach(part => { const m = part.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/); if (!m) return; const a = +m[1], b = m[2] ? +m[2] : a; for (let i = Math.min(a, b); i <= Math.max(a, b); i++) if (i >= 1 && i <= n) set.add(i); });
      return [...set].sort((a, b) => a - b);
    }
    function renderRes() {
      R('all').disabled = !results.length;
      R('res').innerHTML = results.map((r, i) => `<div class="ritem"><img src="${r.url}" alt="Halaman ${r.page}"><div class="meta-line">Hlm ${r.page} · ${r.w}×${r.h} · ${fmtBytes(r.blob.size)}</div><button class="btn sm" data-i="${i}" type="button">${icon('download')}Muat Turun</button></div>`).join('');
    }
    R('res').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const r = results[+b.dataset.i]; saveBlob(r.blob, r.name, 'pdf-to-image'); });
    R('go').addEventListener('click', () => withBusy('Menukar halaman...', async () => {
      const pages = parseRange(v.range, pdf.numPages);
      if (!pages.length) return toast('Julat halaman tidak sah.', 'warn');
      if (pages.length > 100) return toast('Maksimum 100 halaman sekali tukar. Sila hadkan julat.', 'warn');
      results.forEach(r => URL.revokeObjectURL(r.url)); results.length = 0;
      for (let k = 0; k < pages.length; k++) {
        busy(true, `Halaman ${pages[k]} (${k + 1}/${pages.length})...`);
        try {
          const page = await pdf.getPage(pages[k]);
          let vp = page.getViewport({ scale: v.scale });
          const lim = Math.min(1, 8000 / Math.max(vp.width, vp.height)); if (lim < 1) vp = page.getViewport({ scale: v.scale * lim });
          const c = makeCanvas(vp.width, vp.height); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
          await page.render({ canvasContext: x, viewport: vp }).promise;
          const blob = await encode(c, v.fmt, v.q / 100); const url = URL.createObjectURL(blob); scope.urls.push(url);
          results.push({ page: pages[k], blob, url, w: c.width, h: c.height, name: `${baseName(file.name)}-hlm${pages[k]}.${EXT[blob.type]}` });
          renderRes();
        } finally { busy(false); }
        setProgress((k + 1) / pages.length);
      }
      toast(`${results.length} halaman berjaya ditukar.`, 'success');
    }));
    R('all').addEventListener('click', () => saveZip(results.map(r => ({ blob: r.blob, name: r.name })), `${baseName(file.name)}-gambar.zip`, 'pdf-to-image'));
    R('reset').addEventListener('click', () => { pdf && pdf.destroy(); pdf = null; results.length = 0; R('ws').hidden = true; R('dz').hidden = false; renderRes(); });
  }
});

/* ---------- Image Compressor ---------- */
registerTool({
  id: 'image-compressor', cat: 'edit', name: 'Image Compressor', icon: 'compress', popular: true,
  desc: 'Kecilkan saiz fail JPG, PNG dan WEBP. Lihat saiz asal, saiz baharu dan peratus penjimatan.',
  mount(root, scope) {
    const items = [];
    const v = { q: 70, fmt: 'same', maxw: 0 };
    root.innerHTML = `<div data-r="dz"></div>
      <div class="card toolbar" data-r="bar" hidden>
        <div class="fld" style="flex:2"><span><label for="cmpQ">Kualiti mampatan</label><output data-r="qo">70%</output></span><input id="cmpQ" type="range" min="5" max="100" value="70"><span class="meta-line" style="font-weight:400">Rendah = fail lebih kecil · Tinggi = kualiti lebih baik</span></div>
        <div class="fld"><label for="cmpF">Format output</label><select class="inp" id="cmpF"><option value="same">Sama seperti asal</option><option value="image/jpeg">JPG</option><option value="image/webp">WEBP (paling kecil)</option></select></div>
        <div class="fld"><label for="cmpW">Lebar maksimum</label><select class="inp" id="cmpW"><option value="0">Kekal saiz asal</option><option value="3840">3840 px (4K)</option><option value="2560">2560 px</option><option value="1920">1920 px (Full HD)</option><option value="1280">1280 px</option><option value="1024">1024 px</option><option value="800">800 px</option></select></div>
        <div class="row"><button class="btn primary" data-r="all" type="button">${icon('download')}Muat Turun Semua</button><button class="btn danger" data-r="reset" type="button">${icon('trash')}Reset Semua</button></div>
      </div>
      <div class="summary" data-r="sum"></div>
      <div class="flist" data-r="list"></div>`;
    const R = k => $(`[data-r="${k}"]`, root);
    const dz = dropzone({ accept: 'image/jpeg,image/png,image/webp', multiple: true, title: 'Seret & lepas gambar untuk dimampatkan', hint: `JPG, PNG, WEBP · banyak fail sekali gus · maks ${CONFIG.maxImageMB} MB setiap satu`, onFiles: add });
    R('dz').appendChild(dz);
    const recompute = debounce(() => runAll(), 300);
    $('#cmpQ', root).addEventListener('input', e => { v.q = +e.target.value; R('qo').textContent = v.q + '%'; recompute(); });
    $('#cmpF', root).addEventListener('change', e => { v.fmt = e.target.value; recompute(); });
    $('#cmpW', root).addEventListener('change', e => { v.maxw = +e.target.value; recompute(); });
    async function add(files) {
      const ok = checkFiles(files, { types: ['image/jpeg', 'image/png', 'image/webp'], current: items.length });
      const fresh = [];
      for (const f of ok) { try { const img = await loadImage(f); scope.urls.push(img._url); const it = { id: Math.random().toString(36).slice(2), file: f, img }; items.push(it); fresh.push(it); } catch (e) { toast(e.message, 'error'); } }
      render(); if (fresh.length) runAll(fresh);
    }
    let runId = 0;
    async function runAll(list = items) {
      const my = ++runId; if (!list.length) return;
      busy(true, 'Memampatkan...');
      try {
        for (let k = 0; k < list.length; k++) {
          if (my !== runId) return;
          const it = list[k];
          busy(true, `Memampatkan ${k + 1}/${list.length}...`);
          try { await compress(it); } catch (e) { toast(`${it.file.name}: ${e.message}`, 'error'); } finally { busy(false); }
          setProgress((k + 1) / list.length); render(); await sleep(0);
        }
      } finally { busy(false); }
    }
    async function compress(it) {
      const iw = it.img.naturalWidth, ih = it.img.naturalHeight;
      const s = v.maxw && iw > v.maxw ? v.maxw / iw : 1;
      const c = s < 1 ? await hqResize(it.img, iw * s, ih * s) : toCanvas(it.img);
      const type = v.fmt === 'same' ? it.file.type : v.fmt;
      let blob = await encode(c, type, v.q / 100);
      it.kept = false;
      if (blob.size >= it.file.size && s === 1 && type === it.file.type) { blob = it.file; it.kept = true; }
      it.blob = blob; it.w = c.width; it.h = c.height;
      if (it.outUrl) URL.revokeObjectURL(it.outUrl);
      it.outUrl = URL.createObjectURL(blob); scope.urls.push(it.outUrl);
    }
    function render() {
      R('bar').hidden = !items.length; dz.classList.toggle('compact', items.length > 0);
      const done = items.filter(i => i.blob);
      const o = done.reduce((a, i) => a + i.file.size, 0), n = done.reduce((a, i) => a + i.blob.size, 0);
      R('sum').innerHTML = items.length ? `<span>Fail: <b>${items.length}</b></span><span>Jumlah asal: <b>${fmtBytes(o)}</b></span><span>Selepas mampat: <b>${fmtBytes(n)}</b></span>${o ? `<span>Penjimatan: <b style="color:var(--ok)">${Math.max(0, Math.round((1 - n / o) * 100))}%</b></span>` : ''}` : '';
      R('list').innerHTML = items.map(it => {
        const red = it.blob ? Math.round((1 - it.blob.size / it.file.size) * 100) : 0;
        return `<div class="fitem" data-id="${it.id}"><div class="cmp-thumbs" style="grid-row:span 1"><img src="${it.img._url}" alt="Sebelum" data-a="cmp" title="Sebelum"></div>
        <div style="min-width:0"><div class="nm">${esc(it.file.name)}</div><div class="sub"><span>Asal: ${fmtBytes(it.file.size)}</span>${it.blob ? `<span>→ Baharu: ${fmtBytes(it.blob.size)}</span>${it.kept ? '<span class="save neutral">Sudah optimum · fail asal dikekalkan</span>' : red > 0 ? `<span class="save good">−${red}%</span>` : `<span class="save neutral">+${-red}% (lebih besar)</span>`}<span>${it.w}×${it.h} · ${MIME_LABEL[it.blob.type] || ''}</span>` : '<span>Memproses...</span>'}</div></div>
        <div class="acts">${it.blob ? `<button class="btn sm" data-a="cmp" type="button">${icon('compare')}Sebelum/Selepas</button><button class="btn sm primary" data-a="dl" type="button">${icon('download')}Muat Turun</button>` : ''}<button class="btn sm danger" data-a="rm" type="button" aria-label="Buang">${icon('trash')}</button></div></div>`;
      }).join('');
    }
    R('list').addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if (!b) return; const it = items.find(i => i.id === b.closest('.fitem').dataset.id); if (!it) return;
      if (b.dataset.a === 'rm') { items.splice(items.indexOf(it), 1); render(); }
      if (b.dataset.a === 'dl') saveBlob(it.blob, `${baseName(it.file.name)}-mampat.${EXT[it.blob.type]}`, 'image-compressor');
      if (b.dataset.a === 'cmp' && it.blob) showCompare(`${it.file.name} · ${fmtBytes(it.file.size)} → ${fmtBytes(it.blob.size)}`, it.img._url, it.outUrl);
    });
    R('all').addEventListener('click', () => saveZip(items.filter(i => i.blob).map(i => ({ blob: i.blob, name: `${baseName(i.file.name)}-mampat.${EXT[i.blob.type]}` })), `gambar-mampat-${Date.now()}.zip`, 'image-compressor'));
    R('reset').addEventListener('click', () => { runId++; items.length = 0; render(); toast('Semua fail telah dibuang.', 'info'); });
  }
});

/* ---------- Image Resizer ---------- */
const SIZE_PRESETS = [
  ['YouTube Thumbnail', 1920, 1080], ['YouTube (HD)', 1280, 720], ['Instagram Post', 1080, 1080], ['Instagram Portrait', 1080, 1350], ['Instagram Story', 1080, 1920],
  ['Facebook Post', 1200, 630], ['Facebook Cover', 820, 312], ['TikTok', 1080, 1920], ['Gambar Profil', 400, 400], ['Profil HD', 800, 800], ['X / Twitter Post', 1600, 900], ['LinkedIn Banner', 1584, 396]
];
registerTool({
  id: 'image-resizer', cat: 'edit', name: 'Image Resizer', icon: 'resize', popular: true,
  desc: 'Ubah saiz gambar dengan lebar & tinggi tersuai atau preset YouTube, Instagram, Facebook, TikTok dan profil.',
  mount(root, scope) {
    let img = null, file = null;
    const v = { w: 0, h: 0, lock: true, fit: 'stretch', bg: '#ffffff', fmt: 'image/jpeg', q: 92, sharp: true };
    root.innerHTML = `<div data-r="dz"></div><div class="ws" data-r="ws" hidden>
      <div class="card"><div class="stage-bar"><span class="chip" data-r="info"></span><span class="sp"></span><button class="btn sm" data-r="change" type="button">${icon('upload')}Tukar gambar</button></div><div class="stage"><canvas data-r="cv"></canvas></div></div>
      <aside class="card ws-panel">
        <p class="panel-title">Saiz tersuai</p>
        <div class="two"><label class="fld">Lebar (px)<input class="inp mono" id="rsW" type="number" min="1" max="10000"></label><label class="fld">Tinggi (px)<input class="inp mono" id="rsH" type="number" min="1" max="10000"></label></div>
        <label class="check"><input type="checkbox" id="rsLock" checked>Kekalkan nisbah aspek</label>
        <div class="seg" data-r="pct"><button type="button" data-p="25">25%</button><button type="button" data-p="50">50%</button><button type="button" data-p="75">75%</button><button type="button" data-p="100">Asal</button></div>
        <p class="panel-title">Preset media sosial</p>
        <div class="seg" data-r="presets">${SIZE_PRESETS.map(([n, w, h], i) => `<button type="button" data-i="${i}" title="${w}×${h}">${esc(n)} <span class="mono" style="opacity:.6">${w}×${h}</span></button>`).join('')}</div>
        <div class="fld" data-r="fitwrap"><span>Jika nisbah berbeza</span><div class="seg" data-r="fit"><button type="button" data-f="cover">Potong (penuh)</button><button type="button" data-f="contain">Muat + latar</button><button type="button" data-f="stretch">Regang</button></div></div>
        <label class="fld" data-r="bgwrap">Warna latar<input type="color" id="rsBg" value="#ffffff"></label>
        <hr class="sep"><div class="ctrls" data-r="exp"></div>
        <button class="btn primary block" data-r="dl" type="button">${icon('download')}Muat Turun</button>
      </aside></div>`;
    const R = k => $(`[data-r="${k}"]`, root);
    const dz = dropzone({ accept: 'image/*', title: 'Seret & lepas gambar untuk diubah saiz', hint: `JPG, PNG, WEBP · maks ${CONFIG.maxImageMB} MB`, onFiles: load });
    R('dz').appendChild(dz);
    const W = $('#rsW', root), H = $('#rsH', root), L = $('#rsLock', root);
    async function load(files) {
      const [f] = checkFiles(files, { max: 1 }); if (!f) return;
      try { img = await loadImage(f); scope.urls.push(img._url); file = f; v.w = img.naturalWidth; v.h = img.naturalHeight; v.fit = 'stretch'; v.fmt = ['image/jpeg', 'image/png', 'image/webp'].includes(f.type) ? f.type : 'image/png'; R('dz').hidden = true; R('ws').hidden = false; renderExp(); sync(); }
      catch (e) { toast(e.message, 'error'); }
    }
    function renderExp() { renderControls(R('exp'), [{ type: 'check', key: 'sharp', label: 'Penajaman pintar (Lanczos3 + unsharp)' }, { type: 'seg', key: 'fmt', label: 'Format', options: [['image/jpeg', 'JPG'], ['image/png', 'PNG'], ['image/webp', 'WEBP']] }, { type: 'range', key: 'q', label: 'Kualiti', min: 10, max: 100, unit: '%', show: v => v.fmt !== 'image/png' }], v, () => { }); }
    const ratio = () => img.naturalWidth / img.naturalHeight;
    function sync() {
      W.value = v.w; H.value = v.h;
      const differs = Math.abs(v.w / v.h - ratio()) > 0.01;
      R('fitwrap').hidden = !differs; R('bgwrap').hidden = !(differs && v.fit === 'contain');
      $$('[data-f]', root).forEach(b => b.classList.toggle('on', b.dataset.f === v.fit));
      preview();
    }
    W.addEventListener('input', () => { v.w = clamp(+W.value || 1, 1, 10000); if (v.lock) { v.h = Math.max(1, Math.round(v.w / ratio())); H.value = v.h; } syncLater(); });
    H.addEventListener('input', () => { v.h = clamp(+H.value || 1, 1, 10000); if (v.lock) { v.w = Math.max(1, Math.round(v.h * ratio())); W.value = v.w; } syncLater(); });
    const syncLater = debounce(sync, 200);
    L.addEventListener('change', () => { v.lock = L.checked; if (v.lock) { v.h = Math.round(v.w / ratio()); sync(); } });
    R('pct').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const p = +b.dataset.p / 100; v.w = Math.max(1, Math.round(img.naturalWidth * p)); v.h = Math.max(1, Math.round(img.naturalHeight * p)); sync(); });
    R('presets').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const [, w, h] = SIZE_PRESETS[+b.dataset.i]; v.w = w; v.h = h; v.lock = false; L.checked = false; if (v.fit === 'stretch') v.fit = 'cover'; $$('button', R('presets')).forEach(x => x.classList.toggle('on', x === b)); sync(); });
    R('fit').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; v.fit = b.dataset.f; sync(); });
    $('#rsBg', root).addEventListener('input', e => { v.bg = e.target.value; preview(); });
    R('change').addEventListener('click', () => $('input', dz).click());
    function render(maxSide) {
      const s = Math.min(1, maxSide / Math.max(v.w, v.h));
      const w = Math.max(1, Math.round(v.w * s)), h = Math.max(1, Math.round(v.h * s));
      const differs = Math.abs(v.w / v.h - ratio()) > 0.01;
      if (!differs || v.fit === 'stretch') return resample(img, w, h);
      const c = makeCanvas(w, h), x = ctx2d(c);
      if (v.fit === 'contain') { x.fillStyle = v.bg; x.fillRect(0, 0, w, h); drawContain(x, img, 0, 0, w, h); }
      else drawCover(x, img, 0, 0, w, h);
      return c;
    }
    /* Eksport: Lanczos3 + unsharp (pica) untuk ketajaman maksimum */
    async function renderHQ() {
      const iw = img.naturalWidth, ih = img.naturalHeight, differs = Math.abs(v.w / v.h - ratio()) > 0.01;
      if (!differs || v.fit === 'stretch') return hqResize(img, v.w, v.h, v.sharp);
      if (v.fit === 'contain') {
        const s = Math.min(v.w / iw, v.h / ih), t = await hqResize(img, iw * s, ih * s, v.sharp);
        const c = makeCanvas(v.w, v.h), x = ctx2d(c); x.fillStyle = v.bg; x.fillRect(0, 0, v.w, v.h); x.drawImage(t, Math.round((v.w - t.width) / 2), Math.round((v.h - t.height) / 2)); return c;
      }
      const s = Math.max(v.w / iw, v.h / ih), sw = v.w / s, sh = v.h / s, crop = makeCanvas(sw, sh);
      crop.getContext('2d').drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, 0, 0, crop.width, crop.height);
      return hqResize(crop, v.w, v.h, v.sharp);
    }
    const preview = rafThrottle(() => {
      const c = render(CONFIG.previewMax), cv = R('cv'); cv.width = c.width; cv.height = c.height; cv.getContext('2d').drawImage(c, 0, 0);
      R('info').textContent = `Asal ${img.naturalWidth}×${img.naturalHeight} → Baharu ${v.w}×${v.h} px`;
    });
    R('dl').addEventListener('click', () => withBusy('Mengubah saiz...', async () => {
      if (v.w * v.h > CONFIG.maxPixels) throw new Error('Saiz output terlalu besar untuk browser.');
      await sleep(20); const c = await renderHQ(); const blob = await encode(c, v.fmt, v.q / 100);
      saveBlob(blob, `${baseName(file.name)}-${v.w}x${v.h}.${EXT[blob.type]}`, 'image-resizer');
    }));
  }
});

        renderControls(R('ctrls'), [{ type: 'seg', key: 'aspect', label: 'Nisbah', options: [[0, 'Bebas'], [1, '1:1'], [4 / 3, '4:3'], [3 / 4, '3:4'], [16 / 9, '16:9'], [9 / 16, '9:16'], [3 / 2, '3:2'], [img.naturalWidth / img.naturalHeight, 'Asal']] }], v, () => cropper.setAspect(+v.aspect));
        renderControls(R('exp'), [{ type: 'seg', key: 'fmt', label: 'Format', options: [['image/png', 'PNG'], ['image/jpeg', 'JPG'], ['image/webp', 'WEBP']] }, { type: 'range', key: 'q', label: 'Kualiti', min: 10, max: 100, unit: '%', show: v => v.fmt !== 'image/png' }], v, () => { });
      } catch (e) { toast(e.message, 'error'); }
    }
    R('dl').addEventListener('click', () => withBusy('Memotong...', async () => {
      const r = cropper.get(); const c = makeCanvas(r.w, r.h); ctx2d(c).drawImage(img, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
      const blob = await encode(c, v.fmt, v.q / 100); saveBlob(blob, `${baseName(file.name)}-potong-${r.w}x${r.h}.${EXT[blob.type]}`, 'image-cropper');
    }));
    scope.cleanup.push(() => cropper && cropper.destroy());
  }
});
</script>
<script>
/* ---------- Rotator ---------- */
registerTool(editorTool({
  id: 'image-rotator', cat: 'edit', name: 'Image Rotator', icon: 'rotate', suffix: 'putar',
  desc: 'Putar gambar 90°, 180° atau mana-mana sudut dengan latar lutsinar atau berwarna.',
  defaults: { angle: 0, transparent: true, bg: '#ffffff' },
  controls: [
    { type: 'buttons', label: 'Putaran pantas', buttons: [{ label: '↺ 90° kiri', run: v => v.angle = ((v.angle - 90 + 540) % 360) - 180 }, { label: '↻ 90° kanan', run: v => v.angle = ((v.angle + 90 + 540) % 360) - 180 }, { label: '180°', run: v => v.angle = ((v.angle + 180 + 540) % 360) - 180 }] },
    { type: 'range', key: 'angle', label: 'Sudut', min: -180, max: 180, unit: '°' },
    { type: 'check', key: 'transparent', label: 'Latar lutsinar (PNG/WEBP)' },
    { type: 'color', key: 'bg', label: 'Warna latar', show: v => !v.transparent }
  ],
  draw(src, v) {
    const rad = v.angle * Math.PI / 180, w = src.width, h = src.height;
    const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
    const c = makeCanvas(w * cos + h * sin, w * sin + h * cos), x = ctx2d(c);
    if (!v.transparent) { x.fillStyle = v.bg; x.fillRect(0, 0, c.width, c.height); }
    x.translate(c.width / 2, c.height / 2); x.rotate(rad); x.drawImage(src, -w / 2, -h / 2);
    return c;
  }
}));

/* ---------- Flipper ---------- */

/* ---------- Color Picker ---------- */
registerTool({

  mount(root, scope) {

      <div class="card"><div class="stage-bar"><span class="chip" data-r="info">Gerakkan tetikus / jari atas gambar, klik untuk pilih</span><span class="sp"></span><button class="btn sm" data-r="change" type="button">${icon('upload')}Tukar gambar</button></div><div class="stage"><canvas class="picker-canvas" data-r="cv"></canvas></div></div>
      <aside class="card ws-panel"><p class="panel-title">Warna dipilih</p><div class="big-sw" data-r="sw" style="background:#2457f5"></div>

    const R = k => $(`[data-r="${k}"]`, root);
    const dz = dropzone({ accept: 'image/*', title: 'Seret & lepas gambar untuk ambil warna', onFiles: load });
    R('dz').appendChild(dz); R('change').addEventListener('click', () => $('input', dz).click());
    const cv = R('cv'), loupe = $('#loupe');
    async function load(files) {
      const [f] = checkFiles(files, { max: 1 }); if (!f) return;
      try {
        const img = await loadImage(f); scope.urls.push(img._url);
        full = toCanvas(img); fx = full.getContext('2d', { willReadFrequently: true });
        const p = toCanvas(img, 1600); cv.width = p.width; cv.height = p.height; cv.getContext('2d').drawImage(p, 0, 0);
        R('dz').hidden = true; R('ws').hidden = false; pick(Math.floor(full.width / 2), Math.floor(full.height / 2), false);
      } catch (e) { toast(e.message, 'error'); }
    }
    const pos = e => { const r = cv.getBoundingClientRect(); return [clamp(Math.floor((e.clientX - r.left) / r.width * full.width), 0, full.width - 1), clamp(Math.floor((e.clientY - r.top) / r.height * full.height), 0, full.height - 1)]; };
    function pick(px, py, save) {
      const [r, g, b] = fx.getImageData(px, py, 1, 1).data; const hex = rgbToHex(r, g, b); const [h, s, l] = rgbToHsl(r, g, b); const [c, m, y, k] = rgbToCmyk(r, g, b);
      R('sw').style.background = hex;
      const rows = [['HEX', hex], ['RGB', `rgb(${r}, ${g}, ${b})`], ['HSL', `hsl(${h}, ${s}%, ${l}%)`], ['CMYK', `${c}%, ${m}%, ${y}%, ${k}%`], ['Titik', `x ${px}, y ${py}`]];
      R('kv').innerHTML = rows.map(([k2, val]) => `<span>${k2}</span><code>${val}</code>${k2 === 'Titik' ? '<i></i>' : `<button class="btn sm ghost" type="button" data-copy="${esc(val)}" aria-label="Salin ${k2}">${icon('copy')}</button>`}`).join('');
      if (save) { if (hist[0] !== hex) hist.unshift(hex); hist.length = Math.min(hist.length, 16); R('hist').innerHTML = hist.map(hx => `<button type="button" style="background:${hx}" title="${hx}" data-copy="${hx}" aria-label="Salin ${hx}"></button>`).join(''); copyText(hex, `${hex} disalin`); track('image-color-picker'); }
    }
    root.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (b) copyText(b.dataset.copy); });
    cv.addEventListener('pointermove', e => {
      if (!full) return; const [px, py] = pos(e);
      const lx = loupe.getContext('2d'); lx.imageSmoothingEnabled = false; lx.clearRect(0, 0, 110, 110);
      lx.drawImage(full, px - 5, py - 5, 11, 11, 0, 0, 110, 110); lx.strokeStyle = '#fff'; lx.lineWidth = 2; lx.strokeRect(50, 50, 10, 10); lx.strokeStyle = '#000'; lx.lineWidth = 1; lx.strokeRect(49, 49, 12, 12);
      loupe.style.display = 'block'; loupe.style.left = (e.clientX + 18) + 'px'; loupe.style.top = (e.clientY - 128) + 'px';
      pick(px, py, false);
    });
    cv.addEventListener('pointerleave', () => loupe.style.display = 'none');
    cv.addEventListener('click', e => { if (full) pick(...pos(e), true); });
    scope.cleanup.push(() => loupe.style.display = 'none');
  }
});

registerTool(editorTool({
  id: 'image-blur', cat: 'edit', name: 'Image Blur Tool', icon: 'blur', suffix: 'kabur',
  desc: 'Kaburkan gambar atau gunakan kesan mozek (pixelate) untuk sorok maklumat sensitif.',

    { type: 'seg', key: 'mode', label: 'Jenis', options: [['blur', 'Kabur (blur)'], ['pixel', 'Mozek (pixelate)']] },

/* ---------- Border Maker ---------- */
registerTool(editorTool({
  id: 'image-border', cat: 'edit', name: 'Image Border Maker', icon: 'border', suffix: 'bingkai', formats: ['image/png', 'image/jpeg', 'image/webp'], defaultFormat: 'image/png',
  desc: 'Tambah bingkai berwarna, berganda atau gradien serta bucu bulat pada gambar.',
  defaults: { width: 40, style: 'solid', color: '#2457f5', color2: '#7b3fe4', radius: 0, gap: '#ffffff' },
  onLoad(v, img) { v.width = Math.max(4, Math.round(Math.min(img.naturalWidth, img.naturalHeight) * .04)); },
  controls: [
    { type: 'seg', key: 'style', label: 'Gaya', options: [['solid', 'Padu'], ['double', 'Berganda'], ['gradient', 'Gradien']] },
    { type: 'range', key: 'width', label: 'Ketebalan', min: 0, max: 400, unit: ' px' },
    { type: 'color', key: 'color', label: 'Warna bingkai' },
    { type: 'color', key: 'color2', label: 'Warna kedua (gradien)', show: v => v.style === 'gradient' },
    { type: 'color', key: 'gap', label: 'Warna jarak (berganda)', show: v => v.style === 'double' },
    { type: 'range', key: 'radius', label: 'Bucu bulat', min: 0, max: 50, unit: '%' }
  ],
  draw(src, v, s) {
    const b = Math.round(v.width * s), W = src.width + 2 * b, H = src.height + 2 * b;
    const c = makeCanvas(W, H), x = ctx2d(c); const R = Math.min(W, H) / 2 * v.radius / 100;
    roundRectPath(x, c, 0, 0, W, H, R); x.save(); x.clip();
    if (v.style === 'gradient') { const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, v.color); g.addColorStop(1, v.color2); x.fillStyle = g; } else x.fillStyle = v.color;
    x.fillRect(0, 0, W, H);
    if (v.style === 'double' && b >= 3) { const t = b / 3; roundRectPath(x, c, t, t, W - 2 * t, H - 2 * t, Math.max(0, R - t)); x.fillStyle = v.gap; x.fill(); roundRectPath(x, c, 2 * t, 2 * t, W - 4 * t, H - 4 * t, Math.max(0, R - 2 * t)); x.fillStyle = v.color; x.fill(); }
    x.restore();
    roundRectPath(x, c, b, b, src.width, src.height, Math.max(0, R - b)); x.save(); x.clip(); x.drawImage(src, b, b); x.restore();
    return c;
  },
  info: (v, img) => `${img.naturalWidth}×${img.naturalHeight} → ${img.naturalWidth + 2 * v.width}×${img.naturalHeight + 2 * v.width} px`
}));

/* ---------- Metadata Viewer ---------- */
registerTool({
  id: 'image-metadata', cat: 'util', name: 'Image Metadata Viewer', icon: 'info',
  desc: 'Lihat maklumat EXIF tersembunyi: kamera, tarikh, tetapan & lokasi GPS. Buang metadata dengan sekali klik.',
  mount(root, scope) {
    let img = null, file = null, data = null;
    root.innerHTML = `<div data-r="dz"></div><div class="ws" data-r="ws" hidden><div class="card pad" style="display:grid;gap:14px;min-width:0"><div data-r="gps"></div><div data-r="tables" style="display:grid;gap:14px"></div></div>
      <aside class="card ws-panel"><img data-r="th" alt="" style="border-radius:10px;max-height:220px;object-fit:contain;background:var(--soft);width:100%"><div class="kv" data-r="basic"></div>
      <button class="btn primary block" data-r="strip" type="button">${icon('shield')}Buang Metadata & Muat Turun</button><button class="btn block" data-r="json" type="button">${icon('copy')}Salin sebagai JSON</button><button class="btn block" data-r="change" type="button">${icon('upload')}Fail lain</button></aside></div>`;
    const R = k => $(`[data-r="${k}"]`, root);
    const dz = dropzone({ accept: 'image/jpeg,image/png,image/webp,image/avif', title: 'Seret & lepas gambar untuk lihat metadata', hint: 'Terbaik dengan foto JPG asal daripada kamera/telefon', onFiles: load });
    R('dz').appendChild(dz); R('change').addEventListener('click', () => $('input', dz).click());
    const GROUP = { ifd0: 'Peranti & Imej (IFD0)', exif: 'EXIF — Tetapan Kamera', gps: 'GPS — Lokasi', interop: 'Interop', ifd1: 'Thumbnail (IFD1)', iptc: 'IPTC — Hak Cipta & Kapsyen', xmp: 'XMP', jfif: 'JFIF', ihdr: 'PNG Header', icc: 'Profil Warna ICC' };
    const fmtVal = val => {
      if (val == null) return '-';
      if (val instanceof Date) return val.toLocaleString('ms-MY');
      if (val instanceof Uint8Array || val instanceof ArrayBuffer) return `[data binari ${val.byteLength} bait]`;
      if (Array.isArray(val)) return val.length > 16 ? `[${val.length} nilai]` : val.join(', ');
      if (typeof val === 'object') { try { return JSON.stringify(val).slice(0, 300); } catch { return String(val); } }
      if (typeof val === 'number') return Number.isInteger(val) ? String(val) : val.toFixed(4).replace(/0+$/, '');
      return String(val).slice(0, 500);
    };
    async function load(files) {
      const [f] = checkFiles(files, { types: ['image/jpeg', 'image/png', 'image/webp', 'image/avif'], max: 1 }); if (!f) return;
      await withBusy('Membaca metadata...', async () => {
        img = await loadImage(f); scope.urls.push(img._url); file = f;
        await loadScript(LIBS.exifr);
        data = await exifr.parse(f, { tiff: true, exif: true, gps: true, interop: true, ifd1: true, iptc: true, xmp: true, icc: true, jfif: true, ihdr: true, mergeOutput: false, translateValues: true, reviveValues: true }).catch(() => null);
        let gps = null; try { gps = await exifr.gps(f); } catch { }
        R('dz').hidden = true; R('ws').hidden = false; R('th').src = img._url;
        const rows = [['Nama', f.name], ['Jenis', f.type || '-'], ['Saiz', fmtBytes(f.size)], ['Dimensi', `${img.naturalWidth}×${img.naturalHeight}`], ['Nisbah', ratioText(img.naturalWidth, img.naturalHeight)], ['Diubah', new Date(f.lastModified).toLocaleString('ms-MY')]];
        R('basic').innerHTML = rows.map(([k, v]) => `<span>${k}</span><code title="${esc(v)}">${esc(v)}</code><i></i>`).join('');
        R('gps').innerHTML = gps && isFinite(gps.latitude) ? `<div class="banner warning">${icon('alert')}<div><b>Gambar ini mengandungi lokasi GPS.</b> Koordinat: <span class="mono">${gps.latitude.toFixed(6)}, ${gps.longitude.toFixed(6)}</span> · <a href="https://www.openstreetmap.org/?mlat=${gps.latitude}&mlon=${gps.longitude}#map=16/${gps.latitude}/${gps.longitude}" target="_blank" rel="noopener">Lihat di peta</a><br>Buang metadata sebelum kongsi gambar di media sosial untuk melindungi privasi anda.</div></div>` : `<div class="banner success">${icon('shield')}<div>Tiada data lokasi GPS ditemui dalam gambar ini.</div></div>`;
        const groups = data ? Object.entries(data).filter(([, o]) => o && typeof o === 'object' && Object.keys(o).length) : [];
        R('tables').innerHTML = groups.length ? groups.map(([g, o]) => `<div><h3 style="font-size:15px;margin-bottom:8px">${esc(GROUP[g] || g.toUpperCase())} <span class="count">${Object.keys(o).length}</span></h3><div class="tbl-wrap"><table class="tbl"><tbody>${Object.entries(o).map(([k, val]) => `<tr><td class="k">${esc(k)}</td><td class="v">${esc(fmtVal(val))}</td></tr>`).join('')}</tbody></table></div></div>`).join('') : '<div class="empty">Tiada metadata EXIF/IPTC/XMP ditemui. Gambar mungkin telah diproses oleh aplikasi atau media sosial yang membuang metadata.</div>';

    }
    R('json').addEventListener('click', () => copyText(JSON.stringify(data || {}, (k, v) => v instanceof Uint8Array ? `[binari ${v.length}]` : v, 2), 'JSON metadata disalin'));
    R('strip').addEventListener('click', () => withBusy('Membuang metadata...', async () => {
      const type = ['image/jpeg', 'image/png', 'image/webp'].includes(file.type) ? file.type : 'image/png';

/* ---------- Dimension Checker ---------- */
registerTool({
  id: 'image-dimension', cat: 'util', name: 'Image Dimension Checker', icon: 'ruler',
  desc: 'Semak lebar, tinggi, nisbah aspek, megapiksel dan kesesuaian untuk media sosial bagi banyak gambar sekaligus.',
  mount(root, scope) {
    const items = [];
    root.innerHTML = `<div data-r="dz"></div><div data-r="out" hidden><div class="row" style="margin:14px 0 10px"><b>Keputusan</b><span class="count" data-r="cnt"></span><span class="sp"></span><button class="btn sm" data-r="copy" type="button">${icon('copy')}Salin CSV</button><button class="btn sm danger" data-r="reset" type="button">${icon('trash')}Reset</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Gambar</th><th>Nama</th><th>Lebar × Tinggi</th><th>Nisbah</th><th>MP</th><th>Orientasi</th><th>Saiz</th><th>Sesuai untuk</th><th></th></tr></thead><tbody data-r="tb"></tbody></table></div></div>`;
    const R = k => $(`[data-r="${k}"]`, root);
    const dz = dropzone({ accept: 'image/*', multiple: true, title: 'Seret & lepas gambar untuk semak dimensi', onFiles: add });
    R('dz').appendChild(dz);
    const fits = (w, h) => { const r = w / h, o = []; const near = t => Math.abs(r - t) < .02;
      if (near(16 / 9)) o.push(w >= 1280 ? 'YouTube Thumbnail' : '16:9 (kecil)'); if (near(1)) o.push(w >= 1080 ? 'Instagram Post' : w >= 400 ? 'Gambar Profil' : 'Ikon'); if (near(4 / 5)) o.push('Instagram Portrait'); if (near(9 / 16)) o.push('Story / TikTok / Reels'); if (near(1.91)) o.push('Facebook / Link Preview'); if (near(4 / 3)) o.push('Foto 4:3'); if (near(3 / 2)) o.push('Foto DSLR 3:2');
      return o.length ? o : ['—']; };
    async function add(files) {
      const ok = checkFiles(files, { current: items.length });
      for (const f of ok) { try { const img = await loadImage(f); scope.urls.push(img._url); items.push({ f, img, w: img.naturalWidth, h: img.naturalHeight }); } catch (e) { toast(e.message, 'error'); } }
      if (ok.length) track('image-dimension');
      render();
    }
    function render() {
      R('out').hidden = !items.length; dz.classList.toggle('compact', !!items.length); R('cnt').textContent = items.length + ' fail';
      R('tb').innerHTML = items.map((it, i) => `<tr><td><img src="${it.img._url}" alt="" style="width:46px;height:46px;object-fit:cover;border-radius:7px"></td><td style="max-width:200px;word-break:break-all">${esc(it.f.name)}</td><td class="mono"><b>${it.w} × ${it.h}</b> px</td><td class="mono">${ratioText(it.w, it.h)}</td><td class="mono">${(it.w * it.h / 1e6).toFixed(2)}</td><td>${it.w > it.h ? 'Landskap' : it.w < it.h ? 'Potret' : 'Segi empat'}</td><td class="mono">${fmtBytes(it.f.size)}</td><td>${fits(it.w, it.h).map(t => `<span class="chip" style="margin:2px">${t}</span>`).join('')}</td><td><button class="btn sm danger" data-i="${i}" type="button" aria-label="Buang">${icon('trash')}</button></td></tr>`).join('');
    }

/* ---------- Color Palette Extractor ---------- */
function extractPalette(img, k) {
  const c = toCanvas(img, 140), d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; const px = [];
  for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 125) px.push([d[i], d[i + 1], d[i + 2]]);
  if (!px.length) return [];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const dist = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;
  const cents = [px[Math.floor(rnd() * px.length)].slice()];
  while (cents.length < k) { // k-means++
    const ds = px.map(p => Math.min(...cents.map(c => dist(p, c)))); const sum = ds.reduce((a, b) => a + b, 0); if (!sum) break;
    let t = rnd() * sum, i = 0; while ((t -= ds[i]) > 0 && i < ds.length - 1) i++; cents.push(px[i].slice());
  }
  const asg = new Array(px.length).fill(0);
  for (let it = 0; it < 12; it++) {
    const acc = cents.map(() => [0, 0, 0, 0]);
    px.forEach((p, i) => { let best = 0, bd = Infinity; cents.forEach((c, j) => { const dd = dist(p, c); if (dd < bd) { bd = dd; best = j; } }); asg[i] = best; const a = acc[best]; a[0] += p[0]; a[1] += p[1]; a[2] += p[2]; a[3]++; });
    acc.forEach((a, j) => { if (a[3]) cents[j] = [a[0] / a[3], a[1] / a[3], a[2] / a[3]]; });
  }
  const counts = cents.map(() => 0); asg.forEach(a => counts[a]++);
  return cents.map((c, j) => ({ rgb: c.map(Math.round), hex: rgbToHex(...c.map(Math.round)), pct: counts[j] / px.length })).filter(x => x.pct > 0).sort((a, b) => b.pct - a.pct);
}

/* ---------- Favicon Generator ---------- */
function buildIco(pngs) { // pngs: [{size, buf:Uint8Array}]
  const head = 6 + 16 * pngs.length; const total = head + pngs.reduce((a, p) => a + p.buf.length, 0);
  const out = new Uint8Array(total), dv = new DataView(out.buffer);
  dv.setUint16(0, 0, true); dv.setUint16(2, 1, true); dv.setUint16(4, pngs.length, true);
  let off = head;
  pngs.forEach((p, i) => { const e = 6 + i * 16; out[e] = p.size >= 256 ? 0 : p.size; out[e + 1] = p.size >= 256 ? 0 : p.size; out[e + 2] = 0; out[e + 3] = 0; dv.setUint16(e + 4, 1, true); dv.setUint16(e + 6, 32, true); dv.setUint32(e + 8, p.buf.length, true); dv.setUint32(e + 12, off, true); out.set(p.buf, off); off += p.buf.length; });
  return new Blob([out], { type: 'image/x-icon' });
}

}

/* ---------- AI model (RMBG-1.4 oleh BRIA AI, ONNX) ---------- */
const RMBG = { T: null, model: null, proc: null, dtype: null };
async function loadRmbg(dtype, onProgress) {
  if (RMBG.model && RMBG.dtype === dtype) return RMBG;
  const T = RMBG.T || await import(LIBS.transformers);
  RMBG.T = T; T.env.allowLocalModels = false;
  const files = {};
  const progress_callback = p => {
    if (p.status === 'progress' && p.file) { files[p.file] = [p.loaded || 0, p.total || 0]; const v = Object.values(files); const l = v.reduce((a, b) => a + b[0], 0), t = v.reduce((a, b) => a + b[1], 0); onProgress && onProgress(t ? l / t : 0, l, t); }
  };

  if (navigator.gpu) { try { const a = await navigator.gpu.requestAdapter(); if (a) device = 'webgpu'; } catch { } }
  const opts = { config: { model_type: 'custom' }, dtype, progress_callback };
  try { RMBG.model = await T.AutoModel.from_pretrained('briaai/RMBG-1.4', { ...opts, device }); }
  catch (e) { if (device === 'wasm') throw e; console.warn('WebGPU gagal, guna WASM', e); device = 'wasm'; RMBG.model = await T.AutoModel.from_pretrained('briaai/RMBG-1.4', { ...opts, device }); }
  RMBG.proc = RMBG.proc || await T.AutoProcessor.from_pretrained('briaai/RMBG-1.4', { config: { do_normalize: true, do_pad: false, do_rescale: true, do_resize: true, image_mean: [0.5, 0.5, 0.5], feature_extractor_type: 'ImageFeatureExtractor', image_std: [1, 1, 1], resample: 2, rescale_factor: 0.00392156862745098, size: { width: 1024, height: 1024 } } });
  RMBG.dtype = dtype; RMBG.device = device;
  return RMBG;
}
/* Kembalikan topeng (mask) kelabu 0..255 sebagai kanvas pada resolusi model */
async function predictMask(file) {
  const { T, model, proc } = RMBG;
  const image = await T.RawImage.fromBlob(file);
  const { pixel_values } = await proc(image);
  const { output } = await model({ input: pixel_values });
  const m = await T.RawImage.fromTensor(output[0].mul(255).to('uint8'));
  const c = makeCanvas(m.width, m.height), x = c.getContext('2d'), id = x.createImageData(m.width, m.height);
  const ch = m.channels || 1;
  for (let i = 0, j = 0; j < m.width * m.height; j++, i += ch) { const v = m.data[i]; id.data[j * 4] = id.data[j * 4 + 1] = id.data[j * 4 + 2] = v; id.data[j * 4 + 3] = 255; }
  x.putImageData(id, 0, 0);
  return c;
}

    /* Gabung: alpha = topeng (skala penuh, lengkung ketajaman, feather) */
    function cutout(W, H) {

      const im = ox.getImageData(0, 0, W, H), d = im.data;
      const k = v.hard / 100, lo = k * 0.5 * 255, hi = 255 - k * 0.5 * 255;
      for (let i = 0; i < d.length; i += 4) { let a = (md[i] - lo) / (hi - lo); a = a < 0 ? 0 : a > 1 ? 1 : a; a = a * a * (3 - 2 * a) * (k > 0 ? 1 : 0) + (k > 0 ? 0 : md[i] / 255); d[i + 3] = d[i + 3] * a; }

function msToMidnightMYT() { const now = Date.now(), off = 8 * 3600e3; return Math.floor((now + off) / 864e5 + 1) * 864e5 - off - now + 1500; }
const VIS = { users: null, today: null, month: null, total: null };
